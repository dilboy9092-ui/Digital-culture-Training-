       <li><strong>Version History</strong>: on OneDrive/SharePoint, File → Info → Version History restores any earlier version.</li>
     </ul>`,
     tips:['Before major edits: Save As with a new version number.','Version History beats "final_final_v3" every time.'],
     visual:'recover'
    }
  ]
},
{
  id:'common', title:'Common Skills Across All Apps', icon:'⚙️', color:'var(--ms-common)',
  desc:'Text formatting, pictures, hyperlinks, sharing, printing — the shared toolkit.',
  subtopics:[
    {t:'Text formatting properly', s:'Two fonts, bold for emphasis, no ALL CAPS',
     body:`<ul>
       <li>Choose <strong>one or two fonts</strong> for the whole file (Calibri, Arial, Segoe UI).</li>
       <li>Use <strong>bold</strong> for key points — not entire paragraphs.</li>
       <li>Left-align body text. Centre only titles.</li>
       <li>Avoid ALL CAPS and underlining (looks like a hyperlink).</li>
       <li>Use the <strong>mini toolbar</strong> for fast formatting after selecting text.</li>
     </ul>`,
     tips:['Mixed fonts look unprofessional.','Justified text is fine in formal reports but can create wide gaps.'],
     visual:'text'
    },
    {t:'Pictures, shapes & screenshots', s:'Insert, crop, compress & add alt text',
     body:`<ol>
       <li>Insert → <strong>Pictures</strong> (This Device / Stock / Online).</li>
       <li>Use the Picture Format tab to Crop, Compress and add Alt Text.</li>
       <li>In Word, set <strong>Wrap Text</strong> to In Line with Text (stable) or Square.</li>
       <li>Use <strong>Insert → Screenshot</strong> or <strong>Win+Shift+S</strong> for captures.</li>
       <li>Compress pictures (150 ppi / Email) before sending large files.</li>
     </ol>`,
     tips:['Always add Alt Text — accessibility matters and Check Accessibility will thank you.','Use PNG for screenshots, JPEG for photos.'],
     visual:'image'
    },
    {t:'Hyperlinks & cross-references', s:'Ctrl+K and linking to internal sections',
     body:`<p>Press <strong>Ctrl + K</strong> to link text to a web page, a file, an email address, or a place in the same document.</p>
     <p>For internal documents, prefer a link to a <strong>SharePoint / OneDrive</strong> file rather than attaching a copy — everyone then sees the latest version.</p>`,
     tips:['Use Bookmark + Hyperlink for jumping inside a long Word document.','Cross-reference updates automatically when headings move.'],
     visual:'link'
    },
    {t:'Co-authoring & sharing', s:'One cloud file, many editors, zero "final_v3"',
     body:`<ol>
       <li>Save the file to <strong>OneDrive or a Teams / SharePoint library</strong>.</li>
       <li>Click <strong>Share</strong> and choose permissions: Can edit or Can view.</li>
       <li>Prefer <strong>Specific people</strong> for confidential files.</li>
       <li>Several people can edit at once [365] — coloured cursors show who is where.</li>
       <li>Use <strong>Comments</strong> (Ctrl+Alt+M in Word) and @mention colleagues.</li>
     </ol>
     <div class="ms-warn"><b>Warning:</b> Never email a file to five people for changes — you will get five different versions. Share a single cloud link instead.</div>`,
     tips:['Co-authoring requires Microsoft 365.','Comments + @mentions replace long email chains.'],
     visual:'share'
    },
    {t:'Printing & exporting to PDF', s:'Preview first, then print exactly what you need',
     body:`<ul>
       <li>Ctrl + P opens Print & Print Preview together — always preview first.</li>
       <li>Check orientation, paper size (A4), margins, and double-sided.</li>
       <li>Print only the pages you need: Pages 2-4, or Print Selection.</li>
       <li>For sharing final versions, use <strong>Export → Create PDF</strong>.</li>
     </ul>`,
     tips:['Always check the PDF before sending — fonts and layout can shift.','PDF is un-editable — perfect for final deliverables.'],
     visual:'print'
    }
  ]
},
{
  id:'word', title:'Microsoft Word', icon:'📝', color:'var(--ms-word)',
  desc:'Professional documents with styles, tables, TOC, mail merge & review tools.',
  subtopics:[
    {t:'Page setup first', s:'A4, margins, orientation',
     body:`<ol>
       <li>Layout → Size → <strong>A4</strong>.</li>
       <li>Layout → Margins → <strong>Normal (2.54 cm)</strong>; Narrow (1.27 cm) only for dense forms.</li>
       <li>Orientation: Portrait for text, Landscape for wide tables.</li>
       <li>Set default font and spacing in the Styles group before typing.</li>
     </ol>
     <div class="ms-warn"><b>Never</b> press Enter repeatedly for a new page — use <strong>Ctrl+Enter</strong>. Never use the Spacebar to align — use tab stops, indents, or a table.</div>`,
     tips:['Set up the page before typing a single word.','Use paragraph spacing (Home → Line & Paragraph Spacing) instead of blank Enters.'],
     visual:'page'
    },
    {t:'Styles — the most important Word skill', s:'Heading 1, Heading 2, Normal — in that order',
     body:`<p>A <strong>style</strong> is a saved set of formatting. Applying styles gives you:</p>
     <ul>
       <li>The ability to change the look of the entire document in seconds.</li>
       <li>An automatic <strong>table of contents</strong>.</li>
       <li>A <strong>Navigation Pane</strong> that lets you jump to any section.</li>
     </ul>
     <div class="ms-code">Title        → document title (once)
Heading 1    → main sections (Ctrl+Alt+1)
Heading 2    → sub-sections (Ctrl+Alt+2)
Heading 3    → minor sub-sections (Ctrl+Alt+3)
Normal       → body text (Ctrl+Shift+N)</div>`,
     tips:['The #1 professional Word skill — do not manually format headings.','Right-click a style → Modify → change font once for the whole document.'],
     visual:'styles'
    },
    {t:'Paragraph formatting', s:'Spacing, indents & alignment that matter',
     body:`<ul>
       <li><strong>Line spacing</strong> — 1.15 to 1.5 for body text; 1.0 for code/tables.</li>
       <li><strong>Space before/after</strong> — 6pt after paragraph, 0 before.</li>
       <li><strong>Indents</strong> — use paragraph indent, not spaces.</li>
       <li><strong>Alignment</strong> — left for body; centre only for titles.</li>
     </ul>`,
     tips:['Set spacing once in Design → Paragraph Spacing.','Use the ruler to drag margins and indents visually.'],
     visual:'para'
    },
    {t:'Tables, headers & footers', s:'Structure and identity for every page',
     body:`<ul>
       <li><strong>Insert → Table</strong> — use Insert Above/Below/Left/Right to add rows/columns.</li>
       <li>Turn off "Borders" for invisible layout tables; use "Gridlines" for editing.</li>
       <li><strong>Header / Footer</strong> — Insert → Header/Footer → choose layout.</li>
       <li>Insert → <strong>Page Number</strong> → Bottom of Page → Plain Number 2 or 3.</li>
       <li>Different First Page for a cover page without a number.</li>
     </ul>`,
     tips:['Double-click a header to edit it; Esc to return to text.','Page numbers belong in the footer, not typed manually.'],
     visual:'table'
    },
    {t:'Table of contents & captions', s:'Automatic TOC from heading styles',
     body:`<ol>
       <li>Apply Heading 1/2/3 to sections (this is required).</li>
       <li>References → <strong>Table of Contents</strong> → Automatic Table 1.</li>
       <li>Right-click the TOC → <strong>Update Field</strong> whenever headings change.</li>
       <li>Right-click a picture/table → Insert Caption for numbered captions ("Figure 1").</li>
     </ol>`,
     tips:['Never type a TOC manually — it will be wrong the moment a heading moves.','Use References → Cross-reference to point to a caption.'],
     visual:'toc'
    },
    {t:'Find and Replace (with special codes)', s:'Ctrl+H — clean text in seconds',
     body:`<ul>
       <li>Ctrl+H opens Find and Replace.</li>
       <li>Click <strong>More &gt;&gt;</strong> for special characters (^p paragraph, ^t tab).</li>
       <li>Match case, whole words, format — use as needed.</li>
       <li>Replace All is powerful — <strong>Save first</strong> in case you make a mistake.</li>
     </ul>`,
     tips:['Use ^p^p → ^p to collapse double paragraph marks.','Replace with Format lets you change all instances of a word to bold, italic, etc.'],
     visual:'find'
    },
    {t:'Track Changes, Comments & Compare', s:'Collaborative review without confusion',
     body:`<ul>
       <li>Review → <strong>Track Changes</strong> (Ctrl+Shift+E) records every edit.</li>
       <li>Insert a <strong>Comment</strong> (Ctrl+Alt+M) to discuss without editing.</li>
       <li>Review → <strong>Accept</strong> / <strong>Reject</strong> each change.</li>
       <li>Review → <strong>Compare</strong> → Compare Documents to see two versions side-by-side.</li>
     </ul>`,
     tips:['Turn Track Changes OFF before formatting your final version.','Use @mentions in comments to assign work.'],
     visual:'track'
    },
    {t:'Mail Merge', s:'Personalised letters in minutes',
     body:`<ol>
       <li>Start with a <strong>main document</strong> (letter, envelope, label).</li>
       <li>Mailings → <strong>Start Mail Merge</strong> → Letters.</li>
       <li><strong>Select Recipients</strong> → Use an Existing List (Excel .xlsx works perfectly).</li>
       <li>Insert <strong>Merge Fields</strong> where personalised data goes.</li>
       <li><strong>Preview Results</strong> → check the first 3 recipients.</li>
       <li><strong>Finish &amp; Merge</strong> → Print Documents or Edit Individual Documents.</li>
     </ol>`,
     tips:['Always Preview Results before printing.','Save the data source (Excel) next to the Word document so it can be re-merged later.'],
     visual:'mail'
    },
    {t:'Top 30 Word shortcuts', s:'The ones that actually save time',
     body:`<div class="ms-code">Ctrl+N          New document
Ctrl+O          Open
Ctrl+S          Save
Ctrl+P          Print
Ctrl+Z / Y      Undo / Redo
Ctrl+F / H      Find / Replace
Ctrl+B / I / U  Bold / Italic / Underline
Ctrl+K          Insert hyperlink
Ctrl+Alt+1/2/3  Heading 1/2/3
Ctrl+Shift+N    Normal style
Ctrl+Enter      Page break
Ctrl+Shift+E    Track Changes
Ctrl+Alt+M      New comment
Ctrl+Shift+C/V  Copy / Paste formatting
F7              Spelling & grammar
F12             Save As
Alt+Shift+↑/↓   Move paragraph up/down
Shift+F3        Change case
Ctrl+Shift+8    Show/hide ¶ marks
Ctrl+Shift+V    Paste text only</div>`,
     tips:['Learn 5 shortcuts a week — after a month you will never look back.','Alt+Shift+↑/↓ moves paragraphs without cut-paste.'],
     visual:'keys'
    }
  ]
},
{
  id:'excel', title:'Microsoft Excel', icon:'📊', color:'var(--ms-excel)',
  desc:'Formulas, functions, charts, Pivot Tables & dashboards for real office work.',
  subtopics:[
    {t:'Data entry rules', s:'Clean data = clean analysis',
     body:`<ul>
       <li><strong>One data type per column</strong> — numbers, dates, text — never mix.</li>
       <li><strong>One row = one record</strong>; row 1 = headers.</li>
       <li>No blank rows or columns inside the data block.</li>
       <li>Type dates as <strong>YYYY-MM-DD</strong> for sort-safe storage.</li>
       <li>Use <strong>Data Validation</strong> for dropdowns and ranges.</li>
       <li>Never merge cells in a data block — it breaks sorting and filtering.</li>
     </ul>`,
     tips:['Ctrl+; inserts today\'s date.','Ctrl+Shift+; inserts current time.','Use Format as Table (Ctrl+T) for instant banding and filters.'],
     visual:'data'
    },
    {t:'Selecting, moving & navigating fast', s:'Keyboard-first Excel',
     body:`<div class="ms-code">Ctrl+Arrow      Jump to data edge
Ctrl+Home       A1
Ctrl+End        Last used cell
Ctrl+Shift+ArrowExtend selection
Shift+Arrow     Extend selection by one
Ctrl+Space      Select column
Shift+Space     Select row
Ctrl+A          Select all
Alt+=           AutoSum
F4              Toggle $absolute$
F2              Edit cell in place
Ctrl+PgUp/PgDn  Previous/next sheet</div>`,
     tips:['F4 toggles absolute references when writing formulas.','Double-click the fill handle to autofill down.'],
     visual:'select'
    },
    {t:'Formatting numbers & currency', s:'Make numbers readable at a glance',
     body:`<ul>
       <li>Select cells → Ctrl+1 (Format Cells) → Number/Currency/Date.</li>
       <li>Right-align numbers; left-align text — Excel respects type.</li>
       <li>Use <strong>thousands separators</strong> for large numbers (#,##0.00).</li>
       <li>Use <strong>currency symbol</strong> only in the first row of a table, or in totals.</li>
       <li>Use <strong>% format</strong> for percentages — never type the % character manually into a number.</li>
     </ul>`,
     tips:['Formatting is display only — the underlying number stays the same.','Use Format Painter to copy number formats.'],
     visual:'num'
    },
    {t:'Formulas — the basics', s:'Start with = and use cell references',
     body:`<ul>
       <li>Every formula starts with <strong>=</strong>.</li>
       <li>Use <strong>cell references</strong> (A1, B2:B10) — never type numbers directly into a formula.</li>
       <li>Operators: <code>+ - * / ^</code></li>
       <li><strong>Parentheses</strong> work exactly like maths: <code>=(A1+B1)*C1</code></li>
       <li><strong>$</strong> locks a reference: <code>$A$1</code> (both), <code>$A1</code> (column), <code>A$1</code> (row).</li>
       <li>Errors: <code>#DIV/0!</code> divide by zero, <code>#REF!</code> deleted reference, <code>#VALUE!</code> wrong type.</li>
     </ul>`,
     tips:['F4 cycles absolute/relative references.','Ctrl+` (backtick) shows all formulas on the sheet.'],
     visual:'formula'
    },
    {t:'The 15 functions every employee must know', s:'SUM, AVERAGE, IF, VLOOKUP & friends',
     body:`<div class="ms-code">SUM          Add a range            =SUM(B2:B20)
AVERAGE      Mean                   =AVERAGE(B2:B20)
COUNT        Count numbers          =COUNT(B2:B20)
COUNTA       Count non-empty        =COUNTA(A2:A20)
MIN / MAX    Smallest / largest     =MAX(B2:B20)
IF           Conditional logic      =IF(B2&gt;100,"Yes","No")
SUMIF        Sum with condition     =SUMIF(A2:A20,"HR",B2:B20)
COUNTIF      Count with condition   =COUNTIF(A2:A20,"HR")
VLOOKUP      Look up a value        =VLOOKUP(A2,Sheet2!A:C,3,FALSE)
HLOOKUP      Horizontal lookup      =HLOOKUP(A2,Sheet2!A1:D5,2,FALSE)
INDEX+MATCH  Flexible lookup        =INDEX(C:C,MATCH(A2,A:A,0))
IFERROR      Clean errors           =IFERROR(VLOOKUP(...),"Not found")
CONCAT / &   Combine text           =A2&" "&B2
TEXT         Format as text         =TEXT(A2,"yyyy-mm-dd")
TODAY / NOW  Dates                  =TODAY()</div>`,
     tips:['VLOOKUP requires the lookup column to be leftmost — INDEX+MATCH does not.','IFERROR hides ugly errors — but check the cause first.'],
     visual:'func'
    },
    {t:'Sorting, filtering & charts', s:'Turn rows of data into insight',
     body:`<ul>
       <li><strong>Sort</strong>: Data → Sort — by one column or by multiple levels.</li>
       <li><strong>Filter</strong>: Ctrl+Shift+L toggles filter arrows on headers.</li>
       <li><strong>Charts</strong>: select data → Insert → Recommended Charts, or pick:
         <ul>
           <li><strong>Column</strong> — compare categories</li>
           <li><strong>Line</strong> — trend over time</li>
           <li><strong>Pie</strong> — parts of a whole (max 5-7 slices)</li>
           <li><strong>Bar</strong> — long category names</li>
           <li><strong>Scatter</strong> — correlation between two numbers</li>
         </ul>
       </li>
     </ul>`,
     tips:['Never use a pie chart for more than 7 categories.','Always label axes and add a title — even to internal charts.'],
     visual:'chart'
    },
    {t:'Printing Excel properly', s:'Portrait/Landscape, fit to one page, repeat headers',
     body:`<ul>
       <li>Page Layout → <strong>Orientation</strong> → Landscape for wide sheets.</li>
       <li>Page Layout → <strong>Margins</strong> → Narrow for dense data.</li>
       <li>Page Layout → <strong>Print Area → Set Print Area</strong>.</li>
       <li>Page Layout → <strong>Print Titles → Rows to repeat at top</strong>.</li>
       <li>Page Layout → <strong>Width: 1 page</strong> (scale to fit).</li>
       <li>Always <strong>Ctrl+P preview</strong> before printing.</li>
     </ul>`,
     tips:['Print Titles saves you printing 20 pages of headerless data.','Turn off gridlines for printing — use borders on your data instead.'],
     visual:'print'
    }
  ]
},
{
  id:'excel2', title:'Excel for Analysis & Reporting', icon:'📈', color:'var(--ms-excel)',
  desc:'Lookups, Pivot Tables, conditional formatting & dashboards.',
  subtopics:[
    {t:'Lookup functions', s:'VLOOKUP, INDEX+MATCH and XLOOKUP [365]',
     body:`<p>Lookups let you pull data from one table into another — the most-used analysis skill.</p>
     <div class="ms-code">VLOOKUP     =VLOOKUP(id, Table2!A:D, 4, FALSE)
INDEX+MATCH =INDEX(D:D, MATCH(id, A:A, 0))
XLOOKUP [365]=XLOOKUP(id, A:A, D:D, "Not found")</div>
     <p><strong>VLOOKUP</strong> is fine for simple cases. <strong>INDEX+MATCH</strong> handles lookups where the key is not in the first column. <strong>XLOOKUP</strong> [365/2021] does both and includes a "not found" value.</p>`,
     tips:['Set the last argument of VLOOKUP to FALSE for exact matches.','XLOOKUP is the cleanest option if your company has Microsoft 365.'],
     visual:'lookup'
    },
    {t:'Conditional summaries', s:'SUMIF, COUNTIF, SUMIFS, COUNTIFS',
     body:`<div class="ms-code">=SUMIF(A2:A20, "HR", B2:B20)         one condition
=SUMIFS(B2:B20, A2:A20, "HR", C2:C20, "&gt;1000")  many conditions
=COUNTIF(A2:A20, "HR")                count one condition
=COUNTIFS(A2:A20, "HR", C2:C20, "&gt;1000")        count many conditions
=AVERAGEIF(A2:A20, "HR", B2:B20)      average one condition</div>
     <p>Note: <strong>SUMIFS</strong> and <strong>COUNTIFS</strong> take the sum range <em>first</em>, then pairs of criteria ranges and criteria.</p>`,
     tips:['Wildcards work in criteria: "*HR*" matches anything containing HR.','Use cell references for criteria so you can change them without editing the formula.'],
     visual:'sumif'
    },
    {t:'Text, date & cleaning functions', s:'TRIM, LEFT, MID, TEXT, DATEDIF',
     body:`<div class="ms-code">TRIM         Remove extra spaces       =TRIM(A2)
LEFT/RIGHT   Take characters            =LEFT(A2,4)
MID          Take from middle           =MID(A2,2,3)
LEN          Length                     =LEN(A2)
UPPER/LOWER  Change case                =UPPER(A2)
TEXT         Format as text             =TEXT(A2,"yyyy-mm-dd")
YEAR/MONTH   Extract date parts         =YEAR(A2)
DATEDIF      Days/months between dates  =DATEDIF(A2,B2,"d")
CONCAT/TEXTJOIN Join text               =TEXTJOIN(", ",TRUE,A2:A10)</div>`,
     tips:['TRIM is the #1 data-cleaning function — pasted data is full of hidden spaces.','TEXTJOIN [365] handles ranges directly with a delimiter.'],
     visual:'text'
    },
    {t:'Pivot Tables — summarise thousands of rows in seconds', s:'Insert → PivotTable → drag fields',
     body:`<ol>
       <li>Select any cell inside your data.</li>
       <li>Insert → <strong>PivotTable</strong> → New Worksheet.</li>
       <li>Drag fields into four boxes:
         <ul>
           <li><strong>Rows</strong> — categories (department, product)</li>
           <li><strong>Columns</strong> — sub-categories (month, region)</li>
           <li><strong>Values</strong> — numbers to summarise (sum, count, average)</li>
           <li><strong>Filters</strong> — top-level filters</li>
         </ul>
       </li>
       <li>Right-click a value → <strong>Value Field Settings</strong> to change Sum/Count/Average.</li>
       <li>Insert → <strong>Slicer</strong> for visual filtering.</li>
     </ol>`,
     tips:['Refresh a Pivot after data changes: right-click → Refresh (or Alt+F5).','Pivots do not auto-update — or use Format as Table (Ctrl+T) first so new rows are included.'],
     visual:'pivot'
    },
    {t:'Conditional formatting', s:'Colour rules that make managers happy',
     body:`<ul>
       <li>Home → <strong>Conditional Formatting</strong> → Highlight Cells Rules.</li>
       <li>Use <strong>Data Bars</strong> for in-cell bar charts.</li>
       <li>Use <strong>Icon Sets</strong> (🟢 🟡 🔴) for KPI dashboards.</li>
       <li>Use <strong>Colour Scales</strong> (red → green) for heat maps.</li>
       <li>Use <strong>Formula</strong> for custom rules (e.g. highlight entire row if A2="Late").</li>
     </ul>`,
     tips:['Rule of thumb: no more than 3 colours on a single sheet.','Test the rule on the top and bottom of the data range.'],
     visual:'cond'
    },
    {t:'Dynamic arrays [365/2021]', s:'FILTER, UNIQUE, SORT, XLOOKUP',
     body:`<p>These functions <strong>spill</strong> results automatically into neighbouring cells.</p>
     <div class="ms-code">=FILTER(A2:D100, C2:C100="HR")    rows that match
=UNIQUE(A2:A100)                 remove duplicates
=SORT(A2:A100, 1, -1)            sort descending
=SORTBY(A2:D100, B2:B100, 1)     sort by column
=SEQUENCE(10)                    numbers 1..10
=LET(x, A2:A100, SUM(x*2))       name intermediate values</div>`,
     tips:['A #SPILL! error means the cells next to the formula are not empty — clear them.','XLOOKUP is part of this modern family and pairs beautifully with FILTER.'],
     visual:'dyn'
    }
  ]
},
{
  id:'ppt', title:'Microsoft PowerPoint', icon:'🎬', color:'var(--ms-ppt)',
  desc:'Clear slides, strong design, animations and confident presenting.',
  subtopics:[
    {t:'Plan before you open PowerPoint', s:'Story first, slides second',
     body:`<ul>
       <li>Write your <strong>3 key messages</strong> before opening PowerPoint.</li>
       <li>Structure: <strong>Opening → Context → 3 points → Recommendation → Close</strong>.</li>
       <li>One slide = one idea. If a slide has two messages, split it.</li>
       <li>Prepare the <strong>story</strong> in Word first if the deck is complex.</li>
     </ul>`,
     tips:['The slide deck supports the speaker, it is not the speaker.','Rehearse with a timer — 1 slide ≈ 1-2 minutes maximum.'],
     visual:'plan'
    },
    {t:'Slide design rules', s:'Less text, bigger fonts, more contrast',
     body:`<div class="ms-code">DO                          DON'T
─────────────────────        ─────────────────────
One idea per slide           Dump everything on one slide
6-8 bullets max              Full sentences in bullets
Font size 24pt+ body         Tiny 12pt body text
High-contrast text on bg     Yellow on white
Consistent colours           Rainbow slide themes
Real photos where possible   Generic clip art</div>`,
     tips:['If your audience is reading the slide, they are not listening to you.','Use 2 fonts max — one for titles, one for body.'],
     visual:'design'
    },
    {t:'Slide Master & themes', s:'Edit once, apply everywhere',
     body:`<ol>
       <li>View → <strong>Slide Master</strong>.</li>
       <li>Edit the top-level slide — font, colours, logo, footer position.</li>
       <li>Changes cascade to all layout slides below.</li>
       <li>Insert → <strong>Themes</strong> to switch the whole deck's look.</li>
       <li>Design → <strong>Variants</strong> for colour/background variations.</li>
     </ol>`,
     tips:['Never edit slides individually to change fonts — use the Slide Master.','Save your branded master as a .potx template.'],
     visual:'master'
    },
    {t:'Charts & tables in PowerPoint', s:'Insert link, not copy-paste',
     body:`<ul>
       <li>Insert → <strong>Chart</strong> — pick the chart type before entering data.</li>
       <li>Paste a live Excel chart: paste → <strong>Use Destination Theme &amp; Link Data</strong>.</li>
       <li>Or embed a small Excel sheet inside the chart — "Edit Data" opens it.</li>
       <li>Keep charts <strong>simple</strong>: one message per chart.</li>
       <li>Animate a chart to reveal series one at a time (Animations → By Series).</li>
     </ul>`,
     tips:['Label axes and add a data source footnote.','Big number + short label beats a crowded chart.'],
     visual:'chart2'
    },
    {t:'Animations & transitions', s:'Subtle always, flashy never',
     body:`<ul>
       <li><strong>Transitions</strong> — how one slide changes to the next (Morph, Fade, Push).</li>
       <li><strong>Animations</strong> — how content appears on a slide (Appear, Fade, Wipe, Grow).</li>
       <li>Use Animation <strong>Painter</strong> to copy an animation to other objects.</li>
       <li>Set <strong>Start: With Previous / After Previous</strong> carefully.</li>
       <li>For lists: reveal <strong>one bullet at a time</strong> (Animation → By Paragraph).</li>
     </ul>`,
     tips:['A good rule: no more than 1 animation per slide.','Morph transition is PowerPoint\'s most powerful effect — use it for before/after.'],
     visual:'anim'
    },
    {t:'Presenting like a pro', s:'Presenter View, timer, Q&A',
     body:`<ul>
       <li><strong>Slide Show → Presenter View</strong> — speaker notes, timer, next slide.</li>

/* ---------- LANGUAGE HELPERS ---------- */
function LG(){ var l=window.S&&window.S.lang; return (l==='si'||l==='ta'||l==='en')?l:'si'; }
function tt(k,v){
  var d=I18N.U[LG()]; var s=(d&&d[k]!=null)?d[k]:I18N.U.en[k];
  if(v) for(var x in v) s=s.split('{'+x+'}').join(v[x]);
  return s;
}
function cTitle(c){ return LG()==='en'?c.title:((I18N.C[LG()][c.id]||[])[0]||c.title); }
function cDesc(c){ return LG()==='en'?c.desc:((I18N.C[LG()][c.id]||[])[1]||c.desc); }
function sTitle(c,i){ var s=c.subtopics[i]; return LG()==='en'?s.t:(((I18N.T[LG()][c.id]||[])[i])||s.t); }
function qOf(i){
  var e=MS_EXAM[i]; if(LG()==='en')return e;
  var tr=I18N.X[LG()][i]; return tr?{q:tr[0],opts:tr[1]||e.opts,a:e.a}:e;
}
function msApplyStatic(){
  var g=function(id){return document.getElementById(id)};
  if(!g('msTitle'))return;
  g('msTitle').textContent=tt('title'); g('msSub').textContent=tt('sub');
  g('msNavHome').textContent=tt('learn'); g('msNavExam').textContent=tt('exam'); g('msNavCert').textContent=tt('cert');
  document.querySelectorAll('[data-mslang]').forEach(function(b){ b.classList.toggle('on',b.dataset.mslang===LG()); });
}

/* ---------- HELPERS ---------- */
function msOpen(){
  document.getElementById('msOverlay').classList.remove('hide');
  document.body.style.overflow = 'hidden';
  MS_STATE.view = 'home';
  msNav('home');
  document.getElementById('msOverlay').scrollTop = 0;
}
function msClose(){
  document.getElementById('msOverlay').classList.add('hide');
  document.body.style.overflow = '';
  if(window.renderGrid){ try{ window.renderGrid(); }catch(e){} }
}
function msNav(view){
  MS_STATE.view = view;
  if(view==='home') MS_STATE.page='home';
  msApplyStatic();
  document.querySelectorAll('.ms-nav-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.msnav === view));
  const body = document.getElementById('msBody');
  if(view === 'home'){ body.innerHTML = renderHome(); }
  else if(view === 'exam'){
    body.innerHTML = renderExamShell();
    if(MS_STATE.exam.finished){ msShowResult(); }
    else if(MS_STATE.exam.started){ renderExamQuestion(); }
    else { renderExamIntro(); }
  }
  else if(view === 'cert'){ body.innerHTML = renderCertTab(); if(MS_STATE.cert.name && MS_STATE.cert.grade && MS_STATE.cert.grade!=='F'){ msBuildCert(true); } }
  body.style.animation = 'none';
  void body.offsetWidth;
  body.style.animation = 'fadeUp .35s ease';
}
function msLang(l){
  var b=document.querySelector('.lang button[data-l="'+l+'"]');
  if(b) b.click(); else if(window.S){ window.S.lang=l; }
  msRefresh();
}
function msRefresh(){
  var ov=document.getElementById('msOverlay');
  if(!ov||ov.classList.contains('hide'))return;
  msApplyStatic();
  if(MS_STATE.view==='home'){
    if(MS_STATE.page==='cat') msOpenCat(MS_STATE.catId);
    else if(MS_STATE.page==='sub') msOpenSub(MS_STATE.catId,MS_STATE.subIdx);
    else msNav('home');
  } else msNav(MS_STATE.view);
}

/* ---------- HOME (category grid) ---------- */
function renderHome(){
  return `<div class="ms-grid">
    ${MS_CATS.map(c => `
      <button class="ms-cat" style="--ms-c:${c.color}" onclick="msOpenCat('${c.id}')" type="button">
        <div class="ms-ic">${c.icon}</div>
        <h3>${cTitle(c)}</h3>
        <p class="ms-sub">${cDesc(c)}</p>
        <div class="ms-count">${tt('nTopics',{n:c.subtopics.length})}</div>
      </button>`).join('')}
  </div>`;
}

/* ---------- CATEGORY (subtopic list) ---------- */
function msOpenCat(id){
  MS_STATE.catId = id; MS_STATE.page='cat'; MS_STATE.view='home';
  const cat = MS_CATS.find(c => c.id === id);
  const body = document.getElementById('msBody');
  body.innerHTML = `
    <div class="ms-st-head">
      <div class="ms-st-title" style="--ms-c:${cat.color}">
        <div class="ms-ic">${cat.icon}</div>
        <div><h2>${cTitle(cat)}</h2><p>${cDesc(cat)}</p></div>
      </div>
      <button class="ms-nav-btn on" onclick="msNav('home')" type="button">${tt('allCats')}</button>
    </div>
    <div class="ms-list">
      ${cat.subtopics.map((s, i) => `
        <button class="ms-item" style="--ms-c:${cat.color}" onclick="msOpenSub('${id}', ${i})" type="button">
          <div class="num">${String(i+1).padStart(2,'0')}</div>
          <div class="txt"><b>${sTitle(cat,i)}</b><span>${LG()==='en'?s.s:''}</span></div>
          <div class="arr">→</div>
        </button>`).join('')}
    </div>`;
  document.getElementById('msOverlay').scrollTop = 0;
}

/* ---------- SUBTOPIC DETAIL ---------- */
function msOpenSub(catId, idx){
  MS_STATE.catId = catId; MS_STATE.subIdx = idx; MS_STATE.page='sub'; MS_STATE.view='home';
  const cat = MS_CATS.find(c => c.id === catId);
  const sub = cat.subtopics[idx];
  const total = cat.subtopics.length;
  const note = tt('bodyNote');
  const body = document.getElementById('msBody');
  body.innerHTML = `
    <div class="ms-detail" style="--ms-c:${cat.color}">
      <div class="bar-top"></div>
      <div class="ms-detail-inner">
        ${renderVisual(sub.visual, cat.color)}
        <h2>${sTitle(cat,idx)}</h2>
        <div class="sub">${tt('topicOf',{c:cTitle(cat),i:idx+1,n:total})}</div>
        ${note ? `<div class="ms-note">${note}</div>` : ''}
        ${sub.body}
        ${sub.tips ? `<ul class="ms-tips">${sub.tips.map(t=>`<li>${t}</li>`).join('')}</ul>` : ''}
        <div class="ms-nav-foot">
          <button onclick="msOpenCat('${catId}')" type="button">${tt('allTopics')}</button>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${idx>0 ? `<button onclick="msOpenSub('${catId}',${idx-1})" type="button">${tt('prev')}</button>` : ''}
            ${idx<total-1 ? `<button class="primary" onclick="msOpenSub('${catId}',${idx+1})" type="button">${tt('next')}</button>` : `<button class="primary" onclick="msNav('exam')" type="button">${tt('takeExam')}</button>`}
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('msOverlay').scrollTop = 0;
}

/* ---------- EXAM ---------- */
function renderExamShell(){
  return `<div class="ms-exam" id="msExamBox"></div>`;
}
function renderExamIntro(){
  document.getElementById('msExamBox').innerHTML = `
    <div class="ms-exam-head">
      <div class="ms-ic">📝</div>
      <div><h2>${tt('examTitle')}</h2>
      <p>${tt('examSub')}</p></div>
    </div>
    <p style="font-size:14.5px;line-height:1.7">${tt('examIntro')}</p>
    <div style="display:grid;gap:8px;margin:16px 0;font-size:14px">
      <div style="display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;background:color-mix(in srgb,#1a8f4d 10%,transparent);border-left:4px solid #1a8f4d"><b style="min-width:42px">DP</b> ${tt('gDP')}</div>
      <div style="display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;background:color-mix(in srgb,#2b579a 10%,transparent);border-left:4px solid #2b579a"><b style="min-width:42px">MP</b> ${tt('gMP')}</div>
      <div style="display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;background:color-mix(in srgb,#d4af37 14%,transparent);border-left:4px solid #d4af37"><b style="min-width:42px">OP</b> ${tt('gOP')}</div>
      <div style="display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;background:color-mix(in srgb,#e31e24 10%,transparent);border-left:4px solid #e31e24"><b style="min-width:42px">F</b> ${tt('gF')}</div>
    </div>
    <div class="ms-exam-foot" style="justify-content:flex-end">
      <button class="ms-nav-btn on" onclick="msStartExam()" type="button" style="padding:12px 24px;font-size:14px">${tt('start')}</button>
    </div>`;
}
function msStartExam(){
  MS_STATE.exam = { started:true, current:0, answers:new Array(MS_EXAM.length).fill(-1), score:0, finished:false };
  renderExamQuestion();
}
function renderExamQuestion(){
  const e = MS_STATE.exam;
  const q = qOf(e.current);
  const box = document.getElementById('msExamBox');
  const total = MS_EXAM.length;
  const pct = (e.current / total) * 100;
  box.innerHTML = `
    <div class="ms-exam-head">
      <div class="ms-ic">📝</div>
      <div><h2>${tt('qHead',{i:e.current+1,n:total})}</h2>
      <p>${tt('examName')}</p></div>
    </div>
    <div class="ms-exam-progress"><i style="width:${pct}%"></i></div>
    <div class="ms-q"><span class="qn">Q${e.current+1}</span>${q.q}</div>
    ${q.opts.map((o, i) => `<button class="ms-opt" data-idx="${i}" onclick="msAnswer(${i})" type="button">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
    <div class="ms-exam-foot">
      <span class="ctr">${e.answers[e.current] > -1 ? tt('selected') : tt('choose')}</span>
      <div style="display:flex;gap:8px">
        ${e.current > 0 ? `<button class="ms-nav-btn" onclick="msExamPrev()" type="button">${tt('back')}</button>` : ''}
        <button class="ms-nav-btn on" id="msNextBtn" onclick="msExamNext()" type="button" ${e.answers[e.current] === -1 ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>${e.current === total-1 ? tt('finish') : tt('nextQ')}</button>
      </div>
    </div>`;
  document.querySelectorAll('#msExamBox .ms-opt').forEach(b => {
    if(+b.dataset.idx === e.answers[e.current]) b.classList.add('sel');
  });
}
function msAnswer(i){
  MS_STATE.exam.answers[MS_STATE.exam.current] = i;
  document.querySelectorAll('#msExamBox .ms-opt').forEach(b => b.classList.remove('sel'));
  document.querySelector(`#msExamBox .ms-opt[data-idx="${i}"]`).classList.add('sel');
  const btn = document.getElementById('msNextBtn');
  if(btn){ btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
  document.querySelector('#msExamBox .ctr').textContent = tt('selected');
}
function msExamPrev(){
  if(MS_STATE.exam.current > 0){ MS_STATE.exam.current--; renderExamQuestion(); }
}
function msExamNext(){
  const e = MS_STATE.exam;
  if(e.answers[e.current] === -1) return;
  if(e.current === MS_EXAM.length - 1){ msFinishExam(); }
  else { e.current++; renderExamQuestion(); }
}
function msFinishExam(){
  const e = MS_STATE.exam;
  let score = 0;
  MS_EXAM.forEach((q, i) => { if(e.answers[i] === q.a) score++; });
  e.rawScore = score;
  const pct = Math.round(score / MS_EXAM.length * 100);
  e.score = pct;
  e.finished = true;
  MS_STATE.cert.score = pct;
  MS_STATE.cert.grade = pct >= 80 ? 'DP' : pct >= 65 ? 'MP' : pct >= 40 ? 'OP' : 'F';
  MS_STATE.cert.date = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  msSave();
  msShowResult();
}
function msShowResult(){
  const e = MS_STATE.exam, g = MS_STATE.cert.grade, pct = MS_STATE.cert.score;
  const raw = e.rawScore!=null ? e.rawScore : Math.round(pct*MS_EXAM.length/100);
  const box = document.getElementById('msExamBox');
  box.innerHTML = `
    <div class="ms-result g-${g}">
      <div class="grade-badge">${g}</div>
      <h2>${tt(g)}</h2>
      <div class="gname">${tt('grade')}: ${g}</div>
      <div class="gscore">${tt('scored')} <b>${pct}%</b> (${raw} / ${MS_EXAM.length})</div>
      <div class="gbtns">
        <button onclick="msRetakeExam()" type="button">${tt('retake')}</button>
        ${g !== 'F' ? `<button class="primary" onclick="msGoCert()" type="button">${tt('viewCert')}</button>` : ''}
        <button onclick="msNav('home')" type="button">${tt('backLearn')}</button>
      </div>
      ${g === 'F' ? `<div class="ms-warn" style="margin-top:18px;text-align:left">${tt('failNote')}</div>` : ''}
    </div>`;
}
function msRetakeExam(){
  MS_STATE.exam = { started:false, current:0, answers:[], score:0, finished:false };
  MS_STATE.cert = { name:'', score:0, grade:'', date:'' };
  try{ localStorage.removeItem(MS_KEY); }catch(e){}
  renderExamIntro();
}

/* ---------- CERTIFICATE ---------- */
function renderCertTab(){
  const grade = MS_STATE.cert.grade;
  if(!grade || grade === 'F'){
    return `<div class="ms-exam" style="text-align:center;padding:40px 20px">
      <div style="font-size:56px;margin-bottom:14px">🏆</div>
      <h2 style="margin:0 0 8px">${tt('lockTitle')}</h2>

    </div>`;
  }
  const pre = MS_STATE.cert.name || (window.S && window.S.nm) || '';
  return `<div class="ms-exam">
    <div class="ms-exam-head">
      <div class="ms-ic">🏆</div>
      <div><h2>${tt('certHead')}</h2>
      <p>${tt('grade')}: ${grade} · ${tt(grade)} · ${MS_STATE.cert.score}%</p></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <label style="display:block;font-weight:600;font-size:13px;margin:0;flex:1;min-width:220px">${tt('fullName')}
        <input id="msCertName" type="text" value="${esc(pre)}" placeholder="${tt('ph')}" style="margin-top:6px;width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit"/>
      </label>
      <button class="ms-nav-btn on" onclick="msBuildCert()" type="button" style="align-self:flex-end;padding:11px 20px">${tt('gen')}</button>
    </div>
    <div id="msCertArea" style="overflow-x:auto;padding:8px 0"></div>
  </div>`;
}
function msGoCert(){ msNav('cert'); }
function msBuildCert(keep){
  const inp = document.getElementById('msCertName');
  const name = ((inp && inp.value) || MS_STATE.cert.name || '').trim() || tt('defName');
  MS_STATE.cert.name = name; msSave();
  const c = MS_STATE.cert;
  const serial = 'MS-' + Date.now().toString(36).toUpperCase().slice(-8);
  const area = document.getElementById('msCertArea');
  if(!area) return;
  if(inp && !inp.value) inp.value = name;
  area.innerHTML = `
    <div id="msCertWrap">
      <div class="ms-cert">
        <div class="outer-border"></div>
        <div class="inner-border"></div>
        <div class="content">
          <div class="academy">DIGITAL CULTURE ACADEMY</div>
          <div class="dca-logo">DCA<span>·</span></div>
          <div class="top-line"></div>
          <div class="level">${tt('cLevel')}</div>
          <div class="title">${tt('cTitle')}</div>
          <div class="subtitle">${tt('cSub')}</div>
          <div class="presented">${tt('cPres')}</div>
          <div class="employee-name">${esc(name)}</div>
          <div class="description">${tt('cDesc')}</div>
          <div class="grade-line">
            <div class="g-item"><div class="k">${tt('lGrade')}</div><div class="v ${c.grade.toLowerCase()}">${c.grade}</div></div>
            <div class="g-item"><div class="k">${tt('lResult')}</div><div class="v ${c.grade.toLowerCase()}">${tt(c.grade)}</div></div>
            <div class="g-item"><div class="k">${tt('lScore')}</div><div class="v">${c.score}%</div></div>
            <div class="g-item"><div class="k">${tt('lDate')}</div><div class="v" style="font-size:16px;color:#555">${c.date}</div></div>
          </div>
          <div class="training">
            <div class="training-item">Word</div>
            <div class="training-item">Excel</div>
            <div class="training-item">PowerPoint</div>
            <div class="training-item">Outlook</div>
            <div class="training-item">Teams</div>
            <div class="training-item">${tt('iSec')}</div>
            <div class="training-item">${tt('iPro')}</div>
          </div>
          <div class="footer">
            <div class="signature"><div class="signature-line"></div><h4>${tt('sig1')}</h4><p>Digital Culture Academy</p></div>
            <div class="signature"><div class="signature-line"></div><h4>${tt('sig2')}</h4><p>Digital Culture Academy</p></div>
          </div>
          <div class="seal">${tt('seal')}</div>
          <div class="serial">${tt('serial')}: ${serial}</div>
        </div>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="ms-nav-btn on" onclick="msPrintCert()" type="button">${tt('print')}</button>
      <button class="ms-nav-btn" onclick="msBuildCert()" type="button">${tt('regen')}</button>
    </div>`;
  var w = document.getElementById('msCertWrap');
  var sc = Math.min(1, (area.clientWidth || (window.innerWidth - 60)) / 1123);
  w.style.transform = 'scale(' + sc + ')';
  area.style.height = (794 * sc + 70) + 'px';
}
function msPrintCert(){
  document.body.classList.add('ms-printing');
  window.print();
  setTimeout(() => document.body.classList.remove('ms-printing'), 800);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- home-page tool card (called by the page's renderGrid) ---------- */

  var done = MS_STATE.cert.grade && MS_STATE.cert.grade!=='F';
  return '<div class="ic">📘</div><h3>Microsoft Office</h3>'
    +'<div class="mu" style="font-size:13px">'+tt('cardSub')+'</div>'
    +'<div class="ways">'+(done?'<span class="chip" style="background:var(--ok);color:#fff">'+tt('cardDone')+' '+MS_STATE.cert.grade+'</span>':'')+'</div>'
    +'<div class="bar"><i style="width:'+(done?100:0)+'%"></i></div>';
};

});
