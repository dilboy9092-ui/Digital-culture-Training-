/* ===== CARTOON GAMES ===== */
var gT=null;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function renderGames(){
  clearInterval(gT);
  var G=[['🧩','gMatch','gMatchSub'],['⚡','gSprint','gSprintSub'],['🃏','gMem','gMemSub'],['🔌','gCyber','gCyberSub']];
  document.getElementById('t8').innerHTML='<div class="card toon"><h2>'+t('gamesTitle')+'</h2><p class="mu">'+t('gamesSub')+'</p><div class="game-grid">'
   +G.map(function(g,i){return '<button type="button" class="game-card" data-g="'+i+'"><span class="gicon">'+g[0]+'</span><h3>'+t(g[1])+'</h3><div style="font-size:13px">'+t(g[2])+'</div></button>'}).join('')
   +'</div><div id="gbox"></div></div>';
  document.querySelectorAll('.game-card').forEach(function(b){b.onclick=function(){clearInterval(gT);[gMatch,gSprint,gMem,gCyber][+b.dataset.g]();document.getElementById('gbox').scrollIntoView({behavior:'smooth',block:'start'})}});
}
function gTop(m,txt){return '<div class="gtop"><span class="mascot" id="gm">'+m+'</span><div class="bubble" id="gb">'+txt+'</div></div>'}
function gSay(m,txt){document.getElementById('gm').textContent=m;document.getElementById('gb').textContent=txt}
function gMatch(){
  var en=S.lang==='en',idx=shuf([0,1,2,3,4,5,6,7]).slice(0,5),right=shuf(idx),selL=null,selR=null,done=0;
  var box=document.getElementById('gbox');
  box.innerHTML=gTop('🤖',t('gHint'))+'<div class="match-wrap"><div class="match-col">'+idx.map(function(i){return '<div class="match-item" data-s="L" data-i="'+i+'">'+T[i].i+' '+T[i].n+'</div>'}).join('')+'</div><div class="match-col">'+right.map(function(i){return '<div class="match-item" data-s="R" data-i="'+i+'">'+(en?E[i].k:T[i].k)+'</div>'}).join('')+'</div></div>';
  box.querySelectorAll('.match-item').forEach(function(el){el.onclick=function(){
    if(el.dataset.s==='L'){if(selL)selL.classList.remove('sel');selL=el}else{if(selR)selR.classList.remove('sel');selR=el}
    el.classList.add('sel');
    if(selL&&selR){var a=selL,b=selR;selL=selR=null;
      if(a.dataset.i===b.dataset.i){a.className=b.className='match-item ok';burst(b);done++;gSay('😄',t('gYay'));if(done===5){gSay('🥳',t('gWin'));box.insertAdjacentHTML('beforeend','<button class="btn" id="gagain">'+t('gPlayAgain')+'</button>');document.getElementById('gagain').onclick=gMatch}}
      else{a.className=b.className='match-item no';gSay('😵',t('gOops'));setTimeout(function(){a.className=b.className='match-item'},450)}}
  }});
}
function gSprint(){
  var en=S.lang==='en',pool=[];
  T.forEach(function(tl,i){tl.q.forEach(function(_,k){pool.push([i,k])})});
  pool=shuf(pool).slice(0,6);
  var n=0,score=0,box=document.getElementById('gbox');
  function next(){
    clearInterval(gT);
    if(n>=pool.length){box.innerHTML=gTop(score>=4?'🥳':'🙂',t('gScore')+': '+score+' / '+pool.length)+'<button class="btn" id="gagain">'+t('gPlayAgain')+'</button>';document.getElementById('gagain').onclick=gSprint;if(score>=4)burst(document.getElementById('gm'));return}
    var p=pool[n],it=T[p[0]].q[p[1]],ef=en&&E[p[0]].q[p[1]]?E[p[0]].q[p[1]]:it,locked=false,tm=15000;
    box.innerHTML=gTop('🤖',t('gScore')+': '+score+'  •  '+(n+1)+'/'+pool.length)+'<div class="qs-timer"><i id="qt" style="width:100%"></i></div><div class="qs-q">'+T[p[0]].i+' '+ef.q+'</div>'+ef.o.map(function(o,oi){return '<button type="button" class="qs-opt" data-o="'+oi+'">'+o+'</button>'}).join('');
    var opts=box.querySelectorAll('.qs-opt');
    function fin(oi){if(locked)return;locked=true;clearInterval(gT);
      opts.forEach(function(b){b.disabled=true});
      if(oi===it.a){score++;opts[oi].classList.add('good');gSay('😄',t('gYay'));burst(opts[oi])}
      else{if(oi>=0)opts[oi].classList.add('bad');opts[it.a].classList.add('good');gSay('😵',t('gOops'))}
      n++;setTimeout(next,900)}
    opts.forEach(function(b){b.onclick=function(){fin(+b.dataset.o)}});
    gT=setInterval(function(){tm-=100;var q=document.getElementById('qt');if(q)q.style.width=(tm/150)+'%';if(tm<=0)fin(-1)},100);
  }
  next();
}
function gMem(){
  var cards=shuf([0,1,2,3,4,5,6,7,0,1,2,3,4,5,6,7]),open=[],moves=0,found=0,lock=false,box=document.getElementById('gbox');
  box.innerHTML=gTop('🤖',t('gMoves')+': 0')+'<div class="mem-grid">'+cards.map(function(c,i){return '<div class="mem-card" data-k="'+i+'">'+T[c].i+'</div>'}).join('')+'</div>';
  box.querySelectorAll('.mem-card').forEach(function(el){el.onclick=function(){
    if(lock||el.classList.contains('flip')||el.classList.contains('matched'))return;
    el.classList.add('flip');open.push(el);
    if(open.length===2){moves++;gSay('🤔',t('gMoves')+': '+moves);var a=open[0],b=open[1];open=[];
      if(cards[+a.dataset.k]===cards[+b.dataset.k]){a.className=b.className='mem-card matched';found++;burst(b);gSay('😄',t('gYay'));
        if(found===8){gSay('🥳',t('gWin')+' ('+moves+')');box.insertAdjacentHTML('beforeend','<button class="btn" id="gagain">'+t('gPlayAgain')+'</button>');document.getElementById('gagain').onclick=gMem}}
      else{lock=true;setTimeout(function(){a.classList.remove('flip');b.classList.remove('flip');lock=false},700)}}
  }});
}
