<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cyan:#00e5ff;--magenta:#ff2bd6;--green:#39ff14;--yellow:#ffd400;
  --orange:#ff6b35;--purple:#b06bff;--red:#ff2b4d;--bg:#04050a;
}
html,body{height:100%}
body{
  font-family:'Rajdhani',system-ui,sans-serif;
  background:var(--bg);color:#dbe9f4;min-height:100vh;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}

/* BACKGROUND FX */
.bg-grid{position:fixed;inset:-100px;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);
  background-size:52px 52px;transform:perspective(600px) rotateX(58deg) scale(1.6);
  transform-origin:50% 0%;animation:gridScroll 14s linear infinite;opacity:.5}
@keyframes gridScroll{to{background-position:0 52px,52px 0}}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 15% 8%,rgba(0,229,255,.14),transparent 42%),
    radial-gradient(circle at 85% 88%,rgba(255,43,214,.14),transparent 42%);
  animation:glowPulse 8s ease-in-out infinite alternate}
@keyframes glowPulse{to{opacity:.9}}
.scanlines{position:fixed;inset:0;z-index:9990;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);
  opacity:.28;mix-blend-mode:overlay}

/* LAYOUT */
.game-wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:14px 14px 34px}
.game-header{text-align:center;margin-bottom:10px}
.game-header h1{font-family:'Orbitron',sans-serif;font-size:clamp(20px,4vw,36px);
  font-weight:900;letter-spacing:4px;
  background:linear-gradient(90deg,#00e5ff,#b06bff,#ff2bd6,#00e5ff);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 5s linear infinite;filter:drop-shadow(0 0 18px rgba(0,229,255,.55))}
@keyframes gradShift{to{background-position:300% 0}}
.game-header .sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(155,190,220,.8);margin-top:2px;font-weight:700}
.game-header .sub b{color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.7)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.hud-item{flex:1 1 100px;max-width:150px;display:flex;flex-direction:column;
  align-items:center;gap:1px;padding:6px 10px;border-radius:9px;
  background:linear-gradient(160deg,rgba(10,18,30,.92),rgba(5,8,14,.92));
  border:1px solid rgba(0,229,255,.22);
  box-shadow:0 0 18px rgba(0,229,255,.07),inset 0 0 24px rgba(0,229,255,.04);
  position:relative;overflow:hidden}
.hud-item::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  animation:hudSweep 3.5s linear infinite}
@keyframes hudSweep{to{left:100%}}
.hud-label{font-size:9px;letter-spacing:2px;color:rgba(140,175,205,.8);font-weight:700}
.hud-val{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:800;color:#fff;
  text-shadow:0 0 12px var(--cyan)}
#hudScore{color:var(--yellow);text-shadow:0 0 14px rgba(255,212,0,.8)}
#hudCombo{color:var(--magenta);text-shadow:0 0 14px rgba(255,43,214,.8)}
#hudTime.warning{color:var(--red);text-shadow:0 0 14px rgba(255,43,77,.8);
  animation:timePulse .6s ease-in-out infinite alternate}
@keyframes timePulse{to{opacity:.55}}

/* SYSTEM VIEW */
.system-view{
  background:linear-gradient(160deg,rgba(10,18,30,.94),rgba(4,7,13,.96));
  border:1px solid rgba(0,229,255,.24);border-radius:14px;padding:12px;
  margin-bottom:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 34px rgba(0,229,255,.08),inset 0 0 40px rgba(0,229,255,.03);
  transition:all .4s ease}
.system-view.alive{border-color:rgba(57,255,20,.4);
  box-shadow:0 0 40px rgba(57,255,20,.14),0 0 30px rgba(0,229,255,.1),inset 0 0 40px rgba(57,255,20,.05);
  animation:alivePulse 3s ease-in-out infinite alternate}
@keyframes alivePulse{to{box-shadow:0 0 60px rgba(57,255,20,.22),0 0 40px rgba(0,229,255,.18),inset 0 0 40px rgba(57,255,20,.08)}}
.system-view.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* DASHBOARD */
.dash-head{display:flex;align-items:center;gap:8px;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:2.5px;
  color:rgba(0,229,255,.95);text-shadow:0 0 12px rgba(0,229,255,.7);
  padding-bottom:6px;border-bottom:1px solid rgba(0,229,255,.12)}
.live-badge{margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:9px;letter-spacing:1.5px;color:var(--red)}
.live-badge .ld{width:6px;height:6px;border-radius:50%;background:var(--red);
  box-shadow:0 0 8px var(--red);animation:ldBlink 1s ease-in-out infinite}
@keyframes ldBlink{50%{opacity:.2}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.metric{background:rgba(0,0,0,.4);border-radius:6px;padding:6px 8px;
  border:1px solid rgba(0,229,255,.14)}
.metric-label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:9px;letter-spacing:1.5px;color:rgba(150,185,215,.85);
  margin-bottom:4px;font-weight:700}
.metric-label .mv{font-family:'Orbitron',sans-serif;font-size:11px;
  color:#fff;text-shadow:0 0 8px currentColor;transition:color .3s}
.metric-bar{height:4px;background:rgba(0,0,0,.55);border-radius:2px;overflow:hidden}
.metric-fill{height:100%;width:0%;background:var(--c,#00e5ff);border-radius:2px;
  transition:width .55s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px var(--c,#00e5ff)}

/* INDICATORS */
.indicators{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  padding:7px;background:rgba(0,0,0,.35);border-radius:7px;
  border:1px solid rgba(0,229,255,.1)}
.ind{display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 10px;border-radius:5px;font-size:13px;line-height:1;
  color:rgba(150,185,215,.28);border:1px solid rgba(150,185,215,.14);
  transition:.35s;position:relative}
.ind span{font-size:8px;letter-spacing:1.2px;font-weight:800;margin-top:3px}
.ind.active{color:var(--green);border-color:rgba(57,255,20,.65);
  background:rgba(57,255,20,.08);box-shadow:0 0 12px rgba(57,255,20,.4);
  animation:indGlow 2s ease-in-out infinite alternate}
@keyframes indGlow{to{box-shadow:0 0 20px rgba(57,255,20,.7),0 0 30px rgba(57,255,20,.3)}}

/* SCENE — MONITOR + TOWER */
.scene{display:flex;justify-content:center;align-items:center;gap:40px;
  min-height:200px;padding:6px 10px 4px;flex-wrap:wrap}

/* MONITOR */
.monitor-vis{display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 6px 20px rgba(0,0,0,.6));transition:filter .5s}
.monitor-vis.powered{filter:drop-shadow(0 6px 24px rgba(0,229,255,.28))}
.monitor-bezel{width:250px;height:158px;background:linear-gradient(160deg,#1a2230,#0c1220);
  border-radius:8px;padding:7px 7px 15px;position:relative;
  box-shadow:inset 0 0 1px rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.5)}
.screen{width:100%;height:100%;background:#05080d;border-radius:2px;
  overflow:hidden;position:relative;transition:background .5s}
.screen.nosignal{background:#04060c}
.screen.booting{background:#020408}
.screen.desktop{background:linear-gradient(135deg,#071428,#0f2847 60%,#1a3a5c)}
.screen-content{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff}

.monitor-led{position:absolute;bottom:5px;right:10px;width:6px;height:6px;
  border-radius:50%;background:#3a1010;transition:.3s}
.monitor-vis.powered .monitor-led{background:var(--green);
  box-shadow:0 0 8px var(--green)}
.monitor-stand{width:50px;height:14px;background:linear-gradient(180deg,#1a2230,#0c1220);
  border-radius:0 0 3px 3px}
.monitor-base{width:110px;height:6px;background:linear-gradient(180deg,#1a2230,#0c1220);
  border-radius:3px}

/* Screen contents */
.no-signal{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:3px;
  color:rgba(120,150,180,.85);text-shadow:0 0 8px rgba(120,150,180,.4);
  animation:noSig 2s ease-in-out infinite alternate}
@keyframes noSig{50%{opacity:.5}}
.boot-logo{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;
  letter-spacing:4px;margin-bottom:14px;
  background:linear-gradient(90deg,#00e5ff,#b06bff,#ff2bd6);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 2.5s linear infinite;filter:drop-shadow(0 0 14px rgba(0,229,255,.7))}
.boot-bar{width:65%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;
  overflow:hidden;margin-bottom:8px}
.boot-fill{height:100%;background:linear-gradient(90deg,#00e5ff,#39ff14);
  transition:width .1s linear;box-shadow:0 0 10px var(--cyan)}
.boot-text{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;
  color:rgba(150,185,215,.8)}
.desktop-icons{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px}
.d-icon{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;
  font-size:13px;background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.3)}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:20px;
  background:rgba(4,10,20,.85);border-top:1px solid rgba(0,229,255,.3);
  display:flex;align-items:center;padding:0 8px;gap:10px;
  font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:1px;color:rgba(0,229,255,.9)}
.taskbar .start{width:12px;height:12px;border-radius:2px;
  background:linear-gradient(135deg,#00e5ff,#39ff14);
  box-shadow:0 0 8px rgba(0,229,255,.7)}
.taskbar .tb-time{margin-left:auto}
.cursor{position:absolute;font-size:14px;color:#fff;filter:drop-shadow(0 0 4px #000);
  transition:all 1s ease;pointer-events:none}
.desktop-cursor-on .cursor{animation:cursorMove 6s ease-in-out infinite alternate}
@keyframes cursorMove{
  0%{top:50%;left:50%}25%{top:30%;left:70%}
  50%{top:70%;left:40%}75%{top:40%;left:20%}100%{top:60%;left:60%}
}

/* TOWER */
.tower{position:relative;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));
  transition:filter .5s}
.tower.powered{filter:drop-shadow(0 6px 24px rgba(255,43,214,.3))}
.tower-body{width:90px;height:200px;display:flex;border-radius:6px;
  overflow:hidden;box-shadow:inset 0 0 1px rgba(255,255,255,.1);position:relative}
.glass{flex:1;background:linear-gradient(180deg,#0a1220,#040810);
  position:relative;overflow:hidden;border-right:1px solid #1a2030}
.fan{position:absolute;width:48px;height:48px;border-radius:50%;
  border:2px solid rgba(0,229,255,.18);left:50%;transform:translateX(-50%);
  background:repeating-conic-gradient(from 0deg,#162030 0deg 25deg,#243448 25deg 50deg);
  display:flex;align-items:center;justify-content:center;z-index:2}
.fan::before{content:'';width:12px;height:12px;border-radius:50%;
  background:#0a1220;border:2px solid #2a3a4f;z-index:3}
.fan:nth-child(1){top:14px}
.fan:nth-child(2){top:76px}
.tower.powered .fan{animation:spin 1.1s linear infinite}
.tower.powered .fan:nth-child(2){animation-duration:1.35s}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}

.rgb{position:absolute;top:0;left:0;right:0;height:5px;background:#1a2030;z-index:4}
.tower.powered .rgb{animation:rgbShift 3s linear infinite}
@keyframes rgbShift{
  0%{background:linear-gradient(90deg,#f0f,#0ff,#0f0,#ff0);box-shadow:0 0 20px #f0f}
  25%{box-shadow:0 0 20px #0ff}
  50%{background:linear-gradient(90deg,#0f0,#ff0,#f0f,#0ff);box-shadow:0 0 20px #0f0}
  75%{box-shadow:0 0 20px #ff0}
  100%{background:linear-gradient(90deg,#0ff,#0f0,#ff0,#f0f);box-shadow:0 0 20px #0ff}
}
.rgb2{position:absolute;bottom:0;left:0;right:0;height:3px;background:#1a2030;z-index:4}
.tower.powered .rgb2{animation:rgbShift 2.5s linear infinite reverse}

.front{width:22px;background:linear-gradient(180deg,#141c2a,#080c14);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px}
.power-btn{width:12px;height:12px;border-radius:50%;background:#2a1214;
  border:1px solid #4a1a20;transition:.3s}
.tower.powered .power-btn{background:var(--cyan);box-shadow:0 0 12px var(--cyan);
  border-color:var(--cyan)}
.hdd-led{width:6px;height:6px;border-radius:50%;background:#1a1414;
  border:1px solid #3a2222}
.tower.powered .hdd-led{background:var(--yellow);
  box-shadow:0 0 10px var(--yellow);animation:hddBlink 1.4s ease-in-out infinite}
@keyframes hddBlink{0%,100%{opacity:1}50%{opacity:.2}}

/* REAR PANELS */
.rear-panels{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-bottom:12px}
@media (max-width:768px){.rear-panels{grid-template-columns:1fr}}
.rear-panel{border-radius:11px;padding:10px 12px 14px;
  background:linear-gradient(160deg,rgba(12,20,32,.94),rgba(5,8,14,.95));
  border:1px solid rgba(0,229,255,.22);
  box-shadow:0 0 22px rgba(0,229,255,.06),inset 0 0 30px rgba(0,229,255,.03)}
.rear-panel.cpu-rear{border-color:rgba(255,43,214,.25);
  box-shadow:0 0 22px rgba(255,43,214,.06),inset 0 0 30px rgba(255,43,214,.03)}
.rear-head{display:flex;align-items:center;gap:6px;font-family:'Orbitron',sans-serif;
  font-size:10px;font-weight:800;letter-spacing:2px;color:rgba(0,229,255,1);
  text-shadow:0 0 10px rgba(0,229,255,.7);margin-bottom:9px;
  padding-bottom:7px;border-bottom:1px solid rgba(0,229,255,.15)}
.cpu-rear .rear-head{color:rgba(255,43,214,1);text-shadow:0 0 10px rgba(255,43,214,.7);
  border-bottom-color:rgba(255,43,214,.15)}

.ports{display:grid;gap:8px}
.monitor-rear .ports{grid-template-columns:repeat(2,1fr)}
.cpu-rear .ports{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){
  .monitor-rear .ports{grid-template-columns:repeat(2,1fr)}
  .cpu-rear .ports{grid-template-columns:repeat(2,1fr)}
}

.port{--c:0,229,255;position:relative;display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:8px 4px 6px;border-radius:7px;
  background:linear-gradient(170deg,rgba(255,255,255,.03),rgba(0,0,0,.4));
  border:1px solid rgba(120,160,190,.22);cursor:pointer;
  transition:transform .16s,border-color .16s,box-shadow .16s}
.port:hover{transform:translateY(-2px);border-color:rgba(var(--c),.75);
  box-shadow:0 0 18px rgba(var(--c),.4),inset 0 0 14px rgba(var(--c),.12)}
.port.hover{transform:translateY(-3px) scale(1.04);border-color:rgba(var(--c),1);
  box-shadow:0 0 26px rgba(var(--c),.8),inset 0 0 20px rgba(var(--c),.22)}
.port .hole{width:38px;height:22px;background:#06090f;border:2px solid #2f4358;
  border-radius:4px;box-shadow:inset 0 0 8px #000;transition:.2s}
.hole.hdmi{height:18px;border-radius:3px;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}
.hole.vga{height:18px;border-radius:10px/7px}
.hole.usb{width:32px;height:16px;border-radius:2px}
.hole.audio{width:22px;height:22px;border-radius:50%;border-color:#3a6b45}
.hole.lan{width:28px;height:22px;border-radius:2px}
.port-name{font-size:8.5px;letter-spacing:1px;font-weight:700;
  color:rgba(150,185,215,.85);text-align:center;line-height:1.1}
.port.connected{border-color:rgba(57,255,20,.9);
  background:linear-gradient(170deg,rgba(57,255,20,.1),rgba(0,0,0,.42));
  box-shadow:0 0 20px rgba(57,255,20,.5),inset 0 0 16px rgba(57,255,20,.14);
  animation:connPop .4s ease}
@keyframes connPop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.port.connected .hole{border-color:rgba(57,255,20,.9);background:#0a1a06;
  box-shadow:inset 0 0 12px rgba(57,255,20,.6),0 0 12px rgba(57,255,20,.5)}
.port.connected::after{content:'✓';position:absolute;top:-6px;right:-6px;
  width:16px;height:16px;border-radius:50%;background:var(--green);color:#04120a;
  font-size:10px;font-weight:900;line-height:16px;text-align:center;
  box-shadow:0 0 12px rgba(57,255,20,.95)}
.port.wrong{animation:wrongFlash .45s ease;border-color:var(--red)!important;
  box-shadow:0 0 24px rgba(255,43,77,.8),inset 0 0 18px rgba(255,43,77,.28)!important}
@keyframes wrongFlash{0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* CABLE TRAY */
.tray{border-radius:12px;padding:10px 12px 14px;
  background:linear-gradient(160deg,rgba(10,18,30,.94),rgba(4,7,13,.96));
  border:1px solid rgba(0,229,255,.2);
  box-shadow:0 0 26px rgba(0,229,255,.06),inset 0 0 34px rgba(0,229,255,.03)}
.tray-head{display:flex;align-items:center;gap:10px;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;
  letter-spacing:2.5px;color:rgba(0,229,255,.95);
  text-shadow:0 0 12px rgba(0,229,255,.7);
  margin-bottom:9px;padding-bottom:7px;border-bottom:1px dashed rgba(0,229,255,.16)}
.tray-head .count{margin-left:auto;font-size:10px;color:var(--yellow);
  text-shadow:0 0 10px rgba(255,212,0,.8)}
.cables{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cable{--c:0,229,255;display:flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:8px;
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(0,0,0,.44));
  border:1px solid rgba(var(--c),.5);box-shadow:0 0 12px rgba(var(--c),.14);
  cursor:grab;touch-action:none;font-weight:700;font-size:12.5px;
  transition:transform .15s,box-shadow .15s,opacity .25s;white-space:nowrap}
.cable:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(var(--c),.4)}
.cable:active{cursor:grabbing}
.cable .ico{font-size:14px;line-height:1;filter:drop-shadow(0 0 6px rgba(var(--c),.85))}
.cable .txt{color:#dbe9f4}
.cable[data-type="power"]{--c:255,212,0}
.cable[data-type="hdmi"]{--c:0,229,255}
.cable[data-type="vga"]{--c:150,190,220}
.cable[data-type="usb"]{--c:176,107,255}
.cable[data-type="audio"]{--c:57,255,20}
.cable[data-type="lan"]{--c:255,107,53}
.cable.dragging{opacity:.22;transform:scale(.95)}
.cable.done{animation:cableOut .4s ease forwards;pointer-events:none}
@keyframes cableOut{0%{transform:scale(1);opacity:1}
  40%{transform:scale(1.15);filter:brightness(2)}
  100%{transform:scale(.3);opacity:0;margin:-4px -5px;padding:0;width:0;border-width:0}}
.cable.ghost{position:fixed;z-index:9999;pointer-events:none;
  transform:scale(1.1) rotate(-3deg);opacity:.97;margin:0;
  box-shadow:0 14px 40px rgba(var(--c),.6),0 0 28px rgba(var(--c),.45);
  animation:ghostFloat .8s ease-in-out infinite alternate}
@keyframes ghostFloat{to{transform:scale(1.12) rotate(-1deg) translateY(-3px)}}

/* FLOATING TEXT & PARTICLES */
.float-text{position:fixed;z-index:9995;pointer-events:none;
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;
  letter-spacing:1px;text-shadow:0 0 16px currentColor,0 2px 6px rgba(0,0,0,.9);
  transform:translate(-50%,-50%)}
.particle{position:fixed;z-index:9994;pointer-events:none;width:7px;height:7px;
  border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px currentColor}

/* OVERLAYS */
.overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;
  justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% 45%,rgba(6,14,24,.94),rgba(2,4,8,.985));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  transition:opacity .35s,visibility .35s}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.panel{max-width:560px;width:100%;border-radius:18px;padding:26px 24px 24px;
  text-align:center;position:relative;
  background:linear-gradient(165deg,rgba(12,22,36,.98),rgba(4,7,13,.99));
  border:1px solid rgba(0,229,255,.38);
  box-shadow:0 0 60px rgba(0,229,255,.22),inset 0 0 60px rgba(0,229,255,.05);
  animation:panelIn .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes panelIn{from{transform:scale(.88) translateY(24px);opacity:0}}
.panel h2{font-family:'Orbitron',sans-serif;font-size:clamp(18px,4.5vw,28px);
  font-weight:900;letter-spacing:3px;margin-bottom:5px;
  background:linear-gradient(90deg,#00e5ff,#ff2bd6,#39ff14,#00e5ff);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:gradShift 4s linear infinite;
  filter:drop-shadow(0 0 20px rgba(0,229,255,.6))}
.panel h2.danger{background:linear-gradient(90deg,#ff2b4d,#ff6b35,#ff2b4d);
  background-size:300% 100%}
.panel-sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(150,185,215,.75);margin-bottom:18px;font-weight:700}
.rules{text-align:left;margin:0 auto 20px;max-width:440px;display:grid;gap:10px}
.rule{display:flex;gap:10px;align-items:flex-start;font-size:14px;
  line-height:1.45;font-weight:600;color:#c3d8e8}
.rule .n{flex:0 0 22px;height:22px;border-radius:6px;display:grid;
  place-items:center;font-family:'Orbitron',sans-serif;font-size:10px;
  font-weight:900;background:rgba(0,229,255,.14);color:var(--cyan);
  border:1px solid rgba(0,229,255,.45);box-shadow:0 0 12px rgba(0,229,255,.35)}
.btn{font-family:'Orbitron',sans-serif;font-weight:900;font-size:13px;
  letter-spacing:3px;text-transform:uppercase;padding:13px 34px;
  border-radius:10px;cursor:pointer;color:#04121a;border:0;
  background:linear-gradient(135deg,#00e5ff,#39ff14);
  box-shadow:0 0 28px rgba(0,229,255,.6),0 5px 0 rgba(0,90,110,.6);
  transition:transform .13s,box-shadow .2s,filter .2s;
  position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.14);box-shadow:0 0 44px rgba(0,229,255,.9),0 5px 0 rgba(0,90,110,.6)}
.btn:active{transform:translateY(3px);box-shadow:0 0 22px rgba(0,229,255,.6),0 2px 0 rgba(0,90,110,.6)}
.btn::after{content:'';position:absolute;top:0;left:-130%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  transform:skewX(-22deg);animation:btnShine 2.6s ease-in-out infinite}
@keyframes btnShine{0%,60%{left:-130%}100%{left:150%}}
.btn.danger{background:linear-gradient(135deg,#ff2b4d,#ff6b35);
  color:#fff;box-shadow:0 0 28px rgba(255,43,77,.6),0 5px 0 rgba(140,20,40,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{padding:12px 6px;border-radius:10px;background:rgba(0,229,255,.06);
  border:1px solid rgba(0,229,255,.24)}
.stat .k{font-size:9px;letter-spacing:2px;color:rgba(150,185,215,.8);font-weight:700}
.stat .v{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;
  color:var(--yellow);text-shadow:0 0 14px rgba(255,212,0,.85);margin-top:3px}
.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tbtn{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;
  border-radius:7px;cursor:pointer;color:rgba(160,200,230,.95);
  background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.3);
  transition:.2s}
.tbtn:hover{background:rgba(0,229,255,.18);color:#fff;box-shadow:0 0 16px rgba(0,229,255,.4)}
@media (max-width:620px){
  .scene{gap:22px;min-height:170px}
  .monitor-bezel{width:190px;height:120px}
  .monitor-stand{width:40px;height:12px}
  .monitor-base{width:90px}
  .tower-body{width:74px;height:160px}
  .fan{width:40px;height:40px}
  .fan:nth-child(1){top:10px}
  .fan:nth-child(2){top:64px}
  .cable{padding:6px 10px;font-size:11.5px}
  .cable .ico{font-size:12px}
  .game-wrap{padding:10px 10px 24px}
  .panel{padding:20px 16px}
  .hud-item{flex:1 1 30%;max-width:none;padding:5px 7px}
  .hud-val{font-size:14px}
  .hud-label{font-size:8px}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div class="scanlines"></div>

<main class="game-wrap">
  <header class="game-header">
    <h1>CYBER CONNECT</h1>
    <p class="sub" id="levelSub">LEVEL 1 · <b>FIRST BOOT</b></p>
  </header>

  <div class="hud">
    <div class="hud-item"><span class="hud-label">LEVEL</span><span class="hud-val" id="hudLevel">1</span></div>
    <div class="hud-item"><span class="hud-label">SCORE</span><span class="hud-val" id="hudScore">0</span></div>
    <div class="hud-item"><span class="hud-label">PROGRESS</span><span class="hud-val" id="hudProgress">0/8</span></div>
    <div class="hud-item"><span class="hud-label">TIME</span><span class="hud-val" id="hudTime">00:00</span></div>
    <div class="hud-item"><span class="hud-label">COMBO</span><span class="hud-val" id="hudCombo">x1</span></div>
  </div>

  <div class="toolbar">
    <button class="tbtn" id="resetBtn">⟳ RESTART LEVEL</button>
    <button class="tbtn" id="soundBtn">🔊 SOUND ON</button>
  </div>

  <div class="system-view" id="systemView">

    <div>
      <div class="dash-head">
        <span>◉ SYSTEM MONITOR</span>
        <span class="live-badge"><span class="ld"></span>LIVE</span>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label"><span>CPU</span><span class="mv" id="mCpuVal" style="color:#00e5ff">--</span></div>
          <div class="metric-bar"><div class="metric-fill" id="mCpuFill" style="--c:#00e5ff"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label"><span>RAM</span><span class="mv" id="mRamVal" style="color:#b06bff">--</span></div>
          <div class="metric-bar"><div class="metric-fill" id="mRamFill" style="--c:#b06bff"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label"><span>TEMP</span><span class="mv" id="mTempVal" style="color:#ff6b35">--</span></div>
          <div class="metric-bar"><div class="metric-fill" id="mTempFill" style="--c:#ff6b35"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label"><span>NET</span><span class="mv" id="mNetVal" style="color:#39ff14">--</span></div>
          <div class="metric-bar"><div class="metric-fill" id="mNetFill" style="--c:#39ff14"></div></div>
        </div>
      </div>
    </div>

    <div class="indicators">
      <div class="ind" data-ind="power">⚡<span>PWR</span></div>
      <div class="ind" data-ind="display">🖥<span>DISP</span></div>
      <div class="ind" data-ind="input">⌨<span>INPUT</span></div>
      <div class="ind" data-ind="mouse">🖱<span>MOUSE</span></div>
      <div class="ind" data-ind="audio">🔊<span>AUDIO</span></div>
      <div class="ind" data-ind="net">🌐<span>NET</span></div>
    </div>

    <div class="scene" id="scene">
      <div class="monitor-vis" id="monitorVis">
        <div class="monitor-bezel">
          <div class="screen" id="screen">
            <div class="screen-content" id="screenContent"></div>
          </div>
          <div class="monitor-led"></div>
        </div>
        <div class="monitor-stand"></div>
        <div class="monitor-base"></div>
      </div>

      <div class="tower" id="tower">
        <div class="tower-body">
          <div class="glass">
            <div class="rgb"></div>
            <div class="fan"></div>
            <div class="fan"></div>
            <div class="rgb2"></div>
          </div>
          <div class="front">
            <div class="power-btn"></div>
            <div class="hdd-led"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="rear-panels">
    <div class="rear-panel monitor-rear">
      <div class="rear-head"><span>▸</span>MONITOR · REAR PORTS</div>
      <div class="ports" id="monPorts"></div>
    </div>
    <div class="rear-panel cpu-rear">
      <div class="rear-head"><span>▸</span>SYSTEM UNIT · REAR PORTS</div>
      <div class="ports" id="cpuPorts"></div>
    </div>
  </div>

  <div class="tray">
    <div class="tray-head">CABLE INVENTORY <span class="count" id="trayCount">8 LEFT</span></div>
    <div class="cables" id="cables"></div>
  </div>
</main>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <h2>CYBER CONNECT</h2>
    <p class="panel-sub">PC Boot Training Simulator</p>
    <div class="rules">
      <div class="rule"><span class="n">01</span><span>පහළ inventory එකේ ඇති <b>cable</b> එකක් drag කර ගැලපෙන <b>port</b> එකට දාන්න.</span></div>
      <div class="rule"><span class="n">02</span><span>Plug කරන විට <b>PC එක live</b> වෙනවා — fans spin, RGB on, dashboard awake.</span></div>
      <div class="rule"><span class="n">03</span><span>Power + HDMI + Monitor Power 3ම connect වුනාම <b>Boot sequence</b> පටන් ගන්නවා.</span></div>
      <div class="rule"><span class="n">04</span><span>නිවැරදි = +100 × combo. වැරදි = −50, combo reset, screen shake.</span></div>
      <div class="rule"><span class="n">05</span><span>Level 3ක් සම්පූර්ණ කර <b>FULL SYSTEM ONLINE</b> කරන්න!</span></div>
    </div>
    <button class="btn" id="startBtn">START MISSION</button>
  </div>
</div>

<div class="overlay hidden" id="winOverlay">
  <div class="panel">
    <h2 id="winTitle">LEVEL COMPLETE</h2>
    <p class="panel-sub" id="winSub">All Systems Connected</p>
    <div class="stats">
      <div class="stat"><div class="k">SCORE</div><div class="v" id="winScore">0</div></div>
      <div class="stat"><div class="k">TIME</div><div class="v" id="winTime">00:00</div></div>
      <div class="stat"><div class="k">ACCURACY</div><div class="v" id="winAcc">100%</div></div>
    </div>
    <button class="btn" id="nextBtn">NEXT LEVEL →</button>
  </div>
</div>

<div class="overlay hidden" id="failOverlay">
  <div class="panel">
    <h2 class="danger">TIME'S UP</h2>
    <p class="panel-sub">Mission Failed</p>
    <div class="stats" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat"><div class="k">SCORE</div><div class="v" id="failScore">0</div></div>
      <div class="stat"><div class="k">PROGRESS</div><div class="v" id="failProgress">0/8</div></div>
    </div>
    <button class="btn danger" id="retryBtn">TRY AGAIN</button>
  </div>
</div>

<script>
(function(){
'use strict';

const LEVELS = [
  { name:'FIRST BOOT', timeLimit:0,  bonusTime:0,
    desc:'Connect all cables to boot the system',
    cableIds:['c-mon-power','c-cpu-power','c-hdmi-mon','c-hdmi-cpu','c-kb','c-mouse','c-audio','c-lan'] },
  { name:'OVERCLOCK', timeLimit:60, bonusTime:10,
    desc:'Beat the clock — fast connections earn bonus points',
    cableIds:['c-mon-power','c-cpu-power','c-hdmi-mon','c-hdmi-cpu','c-kb','c-mouse','c-audio','c-lan'] },
  { name:'DEEP SCAN', timeLimit:75, bonusTime:10,
    desc:'Full system: connect everything including VGA',
    cableIds:['c-mon-power','c-cpu-power','c-hdmi-mon','c-hdmi-cpu','c-vga-mon','c-vga-cpu','c-kb','c-mouse','c-audio','c-lan'] }
];

const ALL_CABLES = {
  'c-mon-power':{name:'Monitor Power Adapter', icon:'⚡', type:'power', target:'mon-power'},
  'c-cpu-power':{name:'PC Power Cord',          icon:'🔌', type:'power', target:'cpu-power'},
  'c-hdmi-mon': {name:'HDMI — Monitor End',     icon:'📺', type:'hdmi',  target:'mon-hdmi'},
  'c-hdmi-cpu': {name:'HDMI — PC End',          icon:'🖥️', type:'hdmi',  target:'cpu-hdmi'},
  'c-vga-mon':  {name:'VGA — Monitor End',      icon:'📺', type:'vga',   target:'mon-vga'},
  'c-vga-cpu':  {name:'VGA — PC End',           icon:'💻', type:'vga',   target:'cpu-vga'},
  'c-kb':       {name:'Keyboard (USB)',         icon:'⌨️', type:'usb',   target:'cpu-usb-kb'},
  'c-mouse':    {name:'Mouse (USB)',            icon:'🖱️', type:'usb',   target:'cpu-usb-mouse'},
  'c-audio':    {name:'Speaker / Audio Jack',   icon:'🎧', type:'audio', target:'cpu-audio'},
  'c-lan':      {name:'LAN / Ethernet',         icon:'🌐', type:'lan',   target:'cpu-lan'}
};

const MON_PORTS = [
  { id:'mon-power', label:'DC IN',     shape:'power' },
  { id:'mon-hdmi',  label:'HDMI',      shape:'hdmi'  },
  { id:'mon-vga',   label:'VGA',       shape:'vga'   },
  { id:'mon-audio', label:'AUDIO OUT', shape:'audio' }
];
const CPU_PORTS = [
  { id:'cpu-power',     label:'AC IN',    shape:'power' },
  { id:'cpu-hdmi',      label:'HDMI',     shape:'hdmi'  },
  { id:'cpu-vga',       label:'VGA',      shape:'vga'   },
  { id:'cpu-lan',       label:'LAN',      shape:'lan'   },
  { id:'cpu-usb-kb',    label:'USB KB',   shape:'usb'   },
  { id:'cpu-usb-mouse', label:'USB MOUSE',shape:'usb'   },
  { id:'cpu-audio',     label:'AUDIO',    shape:'audio' }
];

const state = {
  level: 0, score: 0, combo: 0, connected: 0, errors: 0,
  seconds: 0, timeLeft: 0, timeLimit: 0,
  started: false, finished: false, muted: false,
  timerId: null, dashId: null,
  totalCables: 8,
  connectedPorts: new Set(),
  systemPowered: false,
  monitorPowered: false,
  hdmiMonitor: false, hdmiPC: false,
  booting: false, booted: false, bootProgress: 0,
  pendingWin: false,
  cpuUsage: 0, ramUsage: 0, tempVal: 0, netUsage: 0
};

const $ = id => document.getElementById(id);
const el = {
  levelSub:$('levelSub'), hudLevel:$('hudLevel'), hudScore:$('hudScore'),
  hudProgress:$('hudProgress'), hudTime:$('hudTime'), hudCombo:$('hudCombo'),
  systemView:$('systemView'), scene:$('scene'),
  monitorVis:$('monitorVis'), tower:$('tower'),
  screen:$('screen'), screenContent:$('screenContent'),
  monPorts:$('monPorts'), cpuPorts:$('cpuPorts'),
  cables:$('cables'), trayCount:$('trayCount'),
  mCpuVal:$('mCpuVal'), mRamVal:$('mRamVal'), mTempVal:$('mTempVal'), mNetVal:$('mNetVal'),
  mCpuFill:$('mCpuFill'), mRamFill:$('mRamFill'), mTempFill:$('mTempFill'), mNetFill:$('mNetFill'),
  startOv:$('startOverlay'), winOv:$('winOverlay'), failOv:$('failOverlay'),
  winTitle:$('winTitle'), winSub:$('winSub'),
  winScore:$('winScore'), winTime:$('winTime'), winAcc:$('winAcc'),
  failScore:$('failScore'), failProgress:$('failProgress'),
  nextBtn:$('nextBtn'), retryBtn:$('retryBtn'), startBtn:$('startBtn'),
  resetBtn:$('resetBtn'), soundBtn:$('soundBtn')
};

let actx = null;
function initAudio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) actx = new AC();
  }
  if(actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay){
  if(state.muted || !actx) return;
  dur=dur||.12; type=type||'sine'; vol=vol||.07; delay=delay||0;
  const t = actx.currentTime + delay;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + dur + .03);
}
const sfxSuccess = () => { tone(680,.10,'triangle',.07); tone(1020,.16,'triangle',.07,.07); };
const sfxError   = () => { tone(170,.18,'sawtooth',.06); tone(110,.24,'sawtooth',.06,.10); };
const sfxPick    = () => tone(520,.05,'square',.035);
const sfxBoot    = () => { [523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.06,i*.09)); };
const sfxWin     = () => { [523,659,784,1046,1318].forEach((f,i)=>tone(f,.22,'triangle',.075,i*.11)); };
const sfxFail    = () => { [330,260,200,150].forEach((f,i)=>tone(f,.25,'sawtooth',.07,i*.13)); };

function burst(x, y, rgb){
  for(let i=0;i<14;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random()*7;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.background = 'rgb('+rgb+')'; p.style.color = 'rgb('+rgb+')';
    document.body.appendChild(p);
    const ang = Math.random()*Math.PI*2, dist = 45 + Math.random()*100;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
    const anim = p.animate([
      {transform:'translate(-50%,-50%) scale(1)', opacity:1},
      {transform:'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(0)', opacity:0}
    ], {duration: 600 + Math.random()*400, easing:'cubic-bezier(.15,.85,.3,1)'});
    anim.onfinish = () => p.remove();
  }
}
function floatText(x, y, text, color){
  const e = document.createElement('div');
  e.className = 'float-text'; e.textContent = text;
  e.style.color = color; e.style.left = x+'px'; e.style.top = y+'px';
  document.body.appendChild(e);
  const anim = e.animate([
    {transform:'translate(-50%,-50%) scale(.5)', opacity:0},
    {transform:'translate(-50%,-140%) scale(1.15)', opacity:1, offset:.35},
    {transform:'translate(-50%,-280%) scale(1)', opacity:0}
  ], {duration: 1100, easing:'ease-out'});
  anim.onfinish = () => e.remove();
}
function shakeScene(){
  el.scene.classList.remove('shake');
  void el.scene.offsetWidth;
  el.scene.classList.add('shake');
  setTimeout(()=>el.scene.classList.remove('shake'), 400);
}

function updateHUD(){
  el.hudLevel.textContent = (state.level+1);
  el.hudScore.textContent = state.score;
  el.hudProgress.textContent = state.connected + '/' + state.totalCables;
  el.hudCombo.textContent = 'x' + Math.max(1, Math.min(state.combo, 5));
  el.hudTime.textContent = state.timeLimit > 0
    ? fmtTime(Math.max(0, state.timeLeft))
    : fmtTime(state.seconds);
  el.hudTime.classList.toggle('warning', state.timeLimit > 0 && state.timeLeft <= 10 && state.timeLeft > 0);
}
function fmtTime(s){
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function updateDashboard(){
  if(state.systemPowered){
    if(state.booting){
      state.cpuUsage = 55 + Math.random()*30;
      state.ramUsage = 40 + Math.random()*25;
      state.tempVal = 38 + Math.random()*15;
    } else if(state.booted){
      state.cpuUsage = 15 + Math.random()*40;
      state.ramUsage = 45 + Math.random()*25;
      state.tempVal = 42 + Math.random()*14;
    } else {
      state.cpuUsage = 25 + Math.random()*25;
      state.ramUsage = 35 + Math.random()*20;
      state.tempVal = 30 + Math.random()*12;
    }
    state.netUsage = state.connectedPorts.has('cpu-lan') ? 25 + Math.random()*60 : 0;
  } else {
    state.cpuUsage = 0; state.ramUsage = 0; state.tempVal = 0; state.netUsage = 0;
  }
  el.mCpuFill.style.width  = state.cpuUsage + '%';
  el.mRamFill.style.width  = state.ramUsage + '%';
  el.mTempFill.style.width = (state.tempVal/80*100) + '%';
  el.mNetFill.style.width  = state.netUsage + '%';
  el.mCpuVal.textContent  = state.systemPowered ? Math.round(state.cpuUsage)+'%' : '--';
  el.mRamVal.textContent  = state.systemPowered ? Math.round(state.ramUsage)+'%' : '--';
  el.mTempVal.textContent = state.systemPowered ? Math.round(state.tempVal)+'°' : '--';
  el.mNetVal.textContent  = state.netUsage > 0 ? Math.round(state.netUsage)+'%' : '--';
}

function updateIndicators(){
  const map = {
    power:   state.systemPowered,
    display: state.hdmiMonitor && state.hdmiPC,
    input:   state.connectedPorts.has('cpu-usb-kb'),
    mouse:   state.connectedPorts.has('cpu-usb-mouse'),
    audio:   state.connectedPorts.has('cpu-audio'),
    net:     state.connectedPorts.has('cpu-lan')
  };
  document.querySelectorAll('.ind').forEach(node => {
    const k = node.dataset.ind;
    node.classList.toggle('active', !!map[k]);
  });
}

function renderScreen(){
  const sc = el.screen, cc = el.screenContent;

  if(!state.monitorPowered){
    sc.className = 'screen';
    cc.innerHTML = '';
    return;
  }

  if(state.booted){
    sc.className = 'screen desktop';
    const hasMouse = state.connectedPorts.has('cpu-usb-mouse');
    cc.innerHTML = `
      <div class="desktop-icons">
        <div class="d-icon">📁</div>
        <div class="d-icon">💻</div>
        <div class="d-icon">🌐</div>
      </div>
      <div class="taskbar">
        <div class="start"></div>
        <span>CYBER OS</span>
        <span class="tb-time">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <div class="cursor" style="${hasMouse?'':'display:none'}">➤</div>
    `;
    if(hasMouse) sc.classList.add('desktop-cursor-on');
    else sc.classList.remove('desktop-cursor-on');
    return;
  }

  if(state.booting){
    sc.className = 'screen booting';
    sc.classList.remove('desktop-cursor-on');
    cc.innerHTML = `
      <div class="boot-logo">CYBER OS</div>
      <div class="boot-bar"><div class="boot-fill" style="width:${state.bootProgress}%"></div></div>
      <div class="boot-text">${Math.floor(state.bootProgress)}% LOADING</div>
    `;
    return;
  }

  sc.className = 'screen nosignal';
  sc.classList.remove('desktop-cursor-on');
  cc.innerHTML = '<div class="no-signal">NO SIGNAL</div>';
}

function checkBootTrigger(){
  if(state.booting || state.booted) return;
  if(!state.systemPowered) return;
  if(!state.monitorPowered) return;
  if(!state.hdmiMonitor || !state.hdmiPC) return;
  startBoot();
}

function startBoot(){
  state.booting = true;
  state.bootProgress = 0;
  renderScreen();
  sfxBoot();

  const duration = 2600;
  const t0 = performance.now();

  function tick(now){
    const elapsed = now - t0;
    state.bootProgress = Math.min(100, (elapsed/duration)*100);
    renderScreen();
    if(state.bootProgress < 100){
      requestAnimationFrame(tick);
    } else {
      state.booting = false;
      state.booted = true;
      renderScreen();
      [784,1046,1318].forEach((f,i)=>tone(f,.16,'triangle',.06,i*.09));
      if(state.pendingWin){ state.pendingWin = false; winLevel(); }
    }
  }
  requestAnimationFrame(tick);
}

function loadLevel(n){
  stopTimer();
  cleanupDrag();

  const cfg = LEVELS[n];
  state.level = n;
  state.score = 0;
  state.combo = 0;
  state.connected = 0;
  state.errors = 0;
  state.seconds = 0;
  state.timeLimit = cfg.timeLimit;
  state.timeLeft = cfg.timeLimit;
  state.started = true;
  state.finished = false;
  state.totalCables = cfg.cableIds.length;
  state.connectedPorts = new Set();
  state.systemPowered = false;
  state.monitorPowered = false;
  state.hdmiMonitor = false;
  state.hdmiPC = false;
  state.booting = false;
  state.booted = false;
  state.bootProgress = 0;
  state.pendingWin = false;

  el.levelSub.innerHTML = 'LEVEL ' + (n+1) + ' · <b>' + cfg.name + '</b>';
  el.hudLevel.textContent = (n+1);

  el.monitorVis.classList.remove('powered');
  el.tower.classList.remove('powered');
  el.systemView.classList.remove('alive');

  buildPorts();
  buildCables(cfg.cableIds);
  updateHUD();
  updateIndicators();
  updateDashboard();
  renderScreen();
  startTimer();

  if(!state.dashId){
    state.dashId = setInterval(updateDashboard, 700);
  }

  el.winOv.classList.add('hidden');
  el.failOv.classList.add('hidden');
  el.startOv.classList.add('hidden');
}

function buildPorts(){
  el.monPorts.innerHTML = '';
  el.cpuPorts.innerHTML = '';

  MON_PORTS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'port';
    div.dataset.port = p.id;
    div.style.setProperty('--c', portColor(p.shape));
    div.innerHTML = `<div class="hole ${p.shape}"></div><span class="port-name">${p.label}</span>`;
    el.monPorts.appendChild(div);
  });
  CPU_PORTS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'port';
    div.dataset.port = p.id;
    div.style.setProperty('--c', portColor(p.shape));
    div.innerHTML = `<div class="hole ${p.shape}"></div><span class="port-name">${p.label}</span>`;
    el.cpuPorts.appendChild(div);
  });
}
function portColor(shape){
  return ({power:'255,212,0', hdmi:'0,229,255', vga:'150,190,220',
    usb:'176,107,255', audio:'57,255,20', lan:'255,107,53'})[shape] || '0,229,255';
}

function buildCables(ids){
  el.cables.innerHTML = '';
  const list = ids.slice();
  if(LEVELS[state.level].timeLimit > 0){
    for(let i=list.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [list[i],list[j]] = [list[j],list[i]];
    }
  }
  list.forEach(id => {
    const c = ALL_CABLES[id];
    const e = document.createElement('div');
    e.className = 'cable';
    e.dataset.id = id;
    e.dataset.type = c.type;
    e.innerHTML = '<span class="ico">'+c.icon+'</span><span class="txt">'+c.name+'</span>';
    el.cables.appendChild(e);
  });
  updateTrayCount();
}
function updateTrayCount(){
  const left = el.cables.querySelectorAll('.cable:not(.done)').length;
  el.trayCount.textContent = left + ' LEFT';
}

function startTimer(){
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(() => {
    if(state.timeLimit > 0){
      state.timeLeft--;
      if(state.timeLeft <= 0){
        state.timeLeft = 0;
        updateHUD();
        failLevel();
        return;
      }
    } else {
      state.seconds++;
    }
    updateHUD();
  }, 1000);
}
function stopTimer(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}

let dragging = null, ghost = null, grabDX = 0, grabDY = 0;

el.cables.addEventListener('pointerdown', e => {
  if(!state.started || state.finished) return;
  const cable = e.target.closest('.cable');
  if(!cable || cable.classList.contains('done')) return;
  e.preventDefault();
  initAudio(); sfxPick();

  dragging = cable;
  const rect = cable.getBoundingClientRect();
  grabDX = e.clientX - rect.left;
  grabDY = e.clientY - rect.top;

  ghost = cable.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.style.width = rect.width+'px';
  ghost.style.height = rect.height+'px';
  ghost.style.left = rect.left+'px';
  ghost.style.top = rect.top+'px';
  document.body.appendChild(ghost);
  cable.classList.add('dragging');
});

document.addEventListener('pointermove', e => {
  if(!dragging || !ghost) return;
  e.preventDefault();
  ghost.style.left = (e.clientX - grabDX)+'px';
  ghost.style.top  = (e.clientY - grabDY)+'px';

  const under = document.elementFromPoint(e.clientX, e.clientY);
  const port = under ? under.closest('.port') : null;
  document.querySelectorAll('.port.hover').forEach(p=>p.classList.remove('hover'));
  if(port && !port.classList.contains('connected')) port.classList.add('hover');
}, {passive:false});

document.addEventListener('pointerup', e => {
  if(!dragging || !ghost) return;
  handleDrop(e.clientX, e.clientY);
});
document.addEventListener('pointercancel', () => { if(dragging) cleanupDrag(); });

function cleanupDrag(){
  document.querySelectorAll('.port.hover').forEach(p=>p.classList.remove('hover'));
  if(ghost){ ghost.remove(); ghost = null; }
  if(dragging){ dragging.classList.remove('dragging'); dragging = null; }
}

function handleDrop(x, y){
  const cableEl = dragging;
  const cableData = ALL_CABLES[cableEl.dataset.id];
  ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  const portEl = under ? under.closest('.port') : null;
  cleanupDrag();
  if(!portEl) return;
  if(portEl.classList.contains('connected')) return;

  if(portEl.dataset.port === cableData.target){
    onSuccess(cableEl, portEl, cableData);
  } else {
    onFail(portEl);
  }
}

function onSuccess(cableEl, portEl, cableData){
  const r = portEl.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;

  portEl.classList.add('connected');
  state.connectedPorts.add(portEl.dataset.port);
  state.connected++;
  state.combo++;
  const mult = Math.min(state.combo, 5);
  const gain = 100 * mult;
  state.score += gain;

  sfxSuccess();
  burst(cx, cy, '57,255,20');
  burst(cx, cy, '0,229,255');
  floatText(cx, cy, '+'+gain, '#39ff14');
  if(mult > 1) floatText(cx, cy-44, 'COMBO x'+mult, '#ff2bd6');

  cableEl.classList.add('done');
  setTimeout(()=>{ cableEl.remove(); updateTrayCount(); }, 400);
  updateTrayCount();

  if(portEl.dataset.port === 'cpu-power'){
    state.systemPowered = true;
    el.tower.classList.add('powered');
    el.systemView.classList.add('alive');
  }
  if(portEl.dataset.port === 'mon-power'){
    state.monitorPowered = true;
    el.monitorVis.classList.add('powered');
  }
  if(portEl.dataset.port === 'mon-hdmi') state.hdmiMonitor = true;
  if(portEl.dataset.port === 'cpu-hdmi') state.hdmiPC = true;

  checkBootTrigger();
  updateIndicators();
  updateDashboard();
  renderScreen();
  updateHUD();

  if(state.connected >= state.totalCables){
    if(state.booting) state.pendingWin = true;
    else winLevel();
  }
}

function onFail(portEl){
  const r = portEl.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;

  portEl.classList.add('wrong');
  setTimeout(()=>portEl.classList.remove('wrong'), 500);

  state.combo = 0;
  state.errors++;
  state.score = Math.max(0, state.score - 50);

  sfxError();
  shakeScene();
  floatText(cx, cy, '-50 WRONG', '#ff2b4d');
  updateHUD();
}

function winLevel(){
  state.finished = true;
  stopTimer();
  sfxWin();

  let bonus = 0;
  if(state.timeLimit > 0 && state.timeLeft > 0){
    bonus = state.timeLeft * 10;
    state.score += bonus;
  }

  const totalTries = state.totalCables + state.errors;
  const acc = Math.round((state.totalCables / totalTries) * 100);
  const isFinal = state.level === LEVELS.length - 1;

  el.winTitle.textContent = isFinal ? 'MISSION COMPLETE' : 'LEVEL COMPLETE';
  el.winSub.textContent  = isFinal
    ? 'FULL SYSTEM ONLINE — All Levels Cleared'
    : LEVELS[state.level].name + ' CLEARED';
  el.winScore.textContent = state.score;
  el.winTime.textContent  = fmtTime(state.seconds);
  el.winAcc.textContent   = acc + '%';
  el.nextBtn.textContent  = isFinal ? 'PLAY AGAIN' : 'NEXT LEVEL →';

  el.winOv.classList.remove('hidden');

  let i = 0;
  const iv = setInterval(() => {
    const x = window.innerWidth  * (0.2 + Math.random()*0.6);
    const y = window.innerHeight * (0.2 + Math.random()*0.5);
    burst(x, y, ['0,229,255','255,43,214','57,255,20','255,212,0'][i%4]);
    if(++i > 6) clearInterval(iv);
  }, 180);
}

function failLevel(){
  state.finished = true;
  stopTimer();
  sfxFail();
  el.failScore.textContent = state.score;
  el.failProgress.textContent = state.connected + '/' + state.totalCables;
  el.failOv.classList.remove('hidden');
}

el.startBtn.addEventListener('click', () => {
  initAudio();
  loadLevel(0);
});

el.nextBtn.addEventListener('click', () => {
  if(state.level < LEVELS.length - 1){
    loadLevel(state.level + 1);
  } else {
    loadLevel(0);
  }
});

el.retryBtn.addEventListener('click', () => {
  loadLevel(state.level);
});

el.resetBtn.addEventListener('click', () => {
  loadLevel(state.level);
});

el.soundBtn.addEventListener('click', () => {
  state.muted = !state.muted;
  el.soundBtn.textContent = state.muted ? '🔇 SOUND OFF' : '🔊 SOUND ON';
  if(!state.muted){ initAudio(); tone(700,.09,'triangle',.06); }
});

buildPorts();
renderScreen();
updateDashboard();
updateIndicators();
updateHUD();

})();
<\/script>

<script>
/* =========================================================
   DATA

function applyLang(){
  document.querySelectorAll('[data-i]').forEach(function(el){
    var k=el.getAttribute('data-i');
    if(k==='oth'){el.textContent=t('oth');return}
    el.textContent=t(k);
  });
  document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===S.lang)});
  var ly=document.getElementById('ly');ly.innerHTML='';
  (LY[S.lang]||LY.si).forEach(function(v,i){
    var o=document.createElement('option');o.value=i;o.textContent=v;ly.appendChild(o);
  });
  ly.value=S.ly;
  document.documentElement.lang=S.lang;
}

document.getElementById('co').addEventListener('change',function(){

});

document.getElementById('go').onclick=function(){
  var co=document.getElementById('co').value;
  if(co==='_o'){co=document.getElementById('co2').value.trim();if(!co){document.getElementById('err').textContent=t('e1');return}}
  var nm=document.getElementById('nm').value.trim();
  var ep=document.getElementById('ep').value.trim();
  if(!nm){document.getElementById('err').textContent=t('e2');return}
  if(!/^\d{3,10}$/.test(ep)){document.getElementById('err').textContent=t('e3');return}
  document.getElementById('err').textContent='';
  S.co=co;S.nm=nm;S.ep=ep;S.ly=parseInt(document.getElementById('ly').value,10)||0;
  save();enterApp();
};

function enterApp(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('mod').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
  document.getElementById('hi').textContent=t('hi')+S.nm;
  document.getElementById('subline').textContent=S.co+' • '+LY[S.lang][S.ly];
  renderGrid();updateProgress();
  showWel();
}

function renderGrid(){
  var g=document.getElementById('grid');g.innerHTML='';
  T.forEach(function(tl,i){
    var p=PRI[S.ly]||[];
    var pr=p.indexOf(i)>=0;
    var d=isDone(i);

    el.type='button';
    el.className='tool card';
    el.style.animationDelay=(i*0.05)+'s';
    el.innerHTML='<div class="ic">'+tl.i+'</div>'
      +'<h3>'+tl.n+'</h3>'
      +'<div class="mu" style="font-size:13px">'+tl.w+'</div>'
      +'<div class="ways">'
        +(pr?'<span class="chip">'+t('star')+'</span>':'')
        +(d?'<span class="chip" style="background:var(--ok);color:#fff">'+t('done')+'</span>':'')
      +'</div>'
      +'<div class="bar"><i style="width:'+(d?100:0)+'%"></i></div>';
    el.onclick=function(){openMod(i)};
    g.appendChild(el);
  });
  if(window.msCardHtml){
    var ms=document.createElement('button');
    ms.type='button';ms.className='tool card';
    ms.style.animationDelay=(T.length*0.05)+'s';
    ms.innerHTML=window.msCardHtml();
    ms.onclick=function(){window.msOpen()};
    g.appendChild(ms);
  }
}

function updateProgress(){
  var n=totalDone(),pct=Math.round(n/T.length*100);

  document.getElementById('tp').textContent=n+' / '+T.length+' ('+pct+'%)';
}

function openMod(i){
  cur=i;
  document.getElementById('home').classList.add('hide');
  document.getElementById('login').classList.add('hide');
  var m=document.getElementById('mod');m.classList.remove('hide');m.classList.add('in');
  document.getElementById('mi').textContent=T[i].i;
  document.getElementById('mn').textContent=T[i].n;
  document.getElementById('mw').textContent=T[i].w;
  document.getElementById('mb').innerHTML=modBody(i);
  renderSteps(i);renderQuiz(i);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('back').onclick=function(){
  document.getElementById('mod').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
  renderGrid();updateProgress();
};

function modBody(i){
  var useSi=S.lang!=='en';
  var who=useSi?T[i].u:E[i].u;
  var top=useSi?T[i].top:E[i].top;
  var fmt=useSi?T[i].f:E[i].f;
  var tips=useSi?(TIPS_SI[i]||T[i].tips):(E[i].tips||T[i].tips);
  var kpi=useSi?T[i].k:E[i].k;
  var risk=useSi?RISK_SI[i]:E[i].risk;
  var h=tvid(i);
  h+='<div class="kv"><b>'+t('who')+':</b> '+who+'</div>';
  h+='<div class="kv"><b>'+t('top')+':</b><ul class="b">'+top.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
  h+='<div class="kv"><b>'+t('fmt')+':</b> '+fmt+'</div>';
  h+='<div class="kv"><b>'+t('tips')+':</b><ul class="tips">'+tips.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
  h+='<div class="kv"><b>'+t('kpi')+':</b> '+kpi+'</div>';
  if(risk)h+='<div class="warn"><b>'+t('risk')+':</b> '+risk+'</div>';
  if(S.lang==='ta')h+='<div class="warn">'+I.ta.ban+'</div>';
  return h;
}

function renderSteps(i){
  var s=st(i);
  var ul=document.getElementById('ms');ul.innerHTML='';
  ['s1','s2','s3'].forEach(function(k,idx){
    var li=document.createElement('li');
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!s[idx];
    cb.setAttribute('aria-label',t(k));
    var sp=document.createElement('span');sp.textContent=t(k);
    cb.onchange=function(){
      s[idx]=cb.checked;save();
      if(isDone(i)){toast(t('toastDone'));burst(li)}
      updateProgress();
    };
    li.appendChild(cb);li.appendChild(sp);ul.appendChild(li);
  });
}

function renderQuiz(i){
  var box=document.getElementById('mq');box.innerHTML='';
  var answered=qz(i);
  T[i].q.forEach(function(item,qi){
    var en=(S.lang==='en'&&E[i]&&E[i].q&&E[i].q[qi])?E[i].q[qi]:null;
    var qt=en?en.q:item.q;
    var opts=en?en.o:item.o;
    var wrap=document.createElement('div');wrap.style.marginTop='16px';
    var lab=document.createElement('div');lab.className='lab';lab.textContent='QUIZ '+(qi+1);
    var qp=document.createElement('b');qp.textContent=qt;
    wrap.appendChild(lab);wrap.appendChild(qp);
    opts.forEach(function(o,oi){
      var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o;
      b.onclick=function(){
        if(answered[qi]!=null)return;
        if(oi===item.a){
          b.classList.add('good','pop');
          answered[qi]=oi;save();
          burst(b);
          if(isDone(i)){toast(t('toastDone'))}
          updateProgress();
        }else{
          b.classList.add('bad','shake');
          toast(t('toastWrong'));
          setTimeout(function(){b.classList.remove('shake')},520);
        }
      };
      wrap.appendChild(b);
    });
    if(answered[qi]!=null){
      var all=wrap.querySelectorAll('.opt');
      if(all[answered[qi]])all[answered[qi]].classList.add('good');
    }
    box.appendChild(wrap);
  });
}

/* =========================================================
   EFFECTS
   ========================================================= */
function burst(el){
  var r=el.getBoundingClientRect();
  var fx=document.getElementById('fx');
  var cols=['#e31e24','#d4af37','#1a8f4d','#7d0d12','#ffffff'];
  for(var i=0;i<20;i++){
    (function(){
      var d=document.createElement('i');d.className='cf';
      d.style.left=(r.left+r.width/2-4+(Math.random()*90-45))+'px';
      d.style.top=(r.top+10)+'px';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(1+Math.random()*0.9)+'s';
      fx.appendChild(d);
      setTimeout(function(){d.remove()},2300);
    })();
  }
}

var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show')},2400);
}

      +'<div class="mu" style="font-size:13px;margin-top:6px">'+t('minutes')+' 20–30 • '+T[i].w+'</div>'

      +'</div>';

}

function renderKnow(){
  var h='<div class="card"><h2>'+t('knowTitle')+'</h2>';
  T.forEach(function(tl,i){
    var tips=S.lang!=='en'?(TIPS_SI[i]||tl.tips):(E[i].tips||tl.tips);
    h+='<div class="kv" style="margin-top:14px"><b>'+tl.i+' '+tl.n+'</b><ul class="tips">'
      +tips.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
  document.getElementById('t3').innerHTML=h;
}

/* =========================================================
   CERTIFICATE
   ========================================================= */
function renderCert(){
  var pr=PRI[S.ly]||[];
  var miss=pr.filter(function(i){return !isDone(i)});
  var ok=miss.length===0;
  var h='';
  if(!ok){
    h+='<div class="warn" style="margin-bottom:12px">'+t('cl')+miss.map(function(i){return T[i].n}).join(', ')+'</div>';
  }
  h+='<div style="overflow:hidden"><div id="certwrap"><div class="certificate">'
   +'<div class="outer-border"></div><div class="inner-border"></div>'
   +'<div class="content">'
   +'<div class="academy">DIGITAL CULTURE ACADEMY</div>'
   +'<div class="dca-logo">DCA<span>•</span></div>'
   +'<div class="top-line"></div>'
   +'<div class="level">'+(S.co||'MAS HOLDINGS').toUpperCase()+'</div>'
   +'<div class="title">Certificate</div>'
   +'<div class="subtitle">OF COMPLETION</div>'
   +'<div class="presented">'+t('cb1')+'</div>'
   +'<div class="employee-name">'+(S.nm||'—')+'</div>'
   +'<div class="description">'+t('cb2')+'<br>EPF No: '+S.ep+' &nbsp;•&nbsp; '+LY[S.lang][S.ly]+'</div>'
   +'<div class="training dense">'+pr.map(function(i){return '<div class="training-item">'+T[i].n+'</div>'}).join('')+'</div>'
   +'<div class="footer">'
   +'<div class="signature"><div class="signature-line"></div><h4>Head of Digital Culture</h4><p>Digital Culture Academy</p></div>'
   +'<div class="signature"><div class="signature-line"></div><h4>Learning &amp; Development</h4><p>'+S.co+'</p></div>'
   +'</div></div>'
   +'<div class="seal">DCA<br>VERIFIED</div>'
   +'</div></div></div>';
  h+='<button class="btn" id="prt">'+t('pr')+'</button>';
  document.getElementById('t4').innerHTML=h;
  var p=document.getElementById('prt');
  if(p)p.onclick=function(){window.print()};
  fitCert();
  window.onresize=fitCert;
}
function fitCert(){
  var host=document.getElementById('t4');
  var cw=document.getElementById('certwrap');
  if(!host||!cw)return;
  var s=Math.min(1,host.clientWidth/1123);
  cw.style.transform='scale('+s+')';
  cw.parentElement.style.height=(794*s)+'px';
}

var aiBusy=false,aiLast=null;
function aiEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function aiLang(txt){if(/[\u0D80-\u0DFF]/.test(txt))return 'si';if(/[\u0B80-\u0BFF]/.test(txt))return 'ta';return S.lang}
function aiNorm(s){return (s||'').toLowerCase().replace(/[^\w\s\u0D80-\u0DFF\u0B80-\u0BFF]/g,' ')}
function aiToks(s){return aiNorm(s).split(/\s+/).filter(function(w){return w.length>1})}

function aiStatus(kind,msg){
  var st=document.getElementById('aiStatus');if(!st)return;
  st.className='ai-status'+(kind?' '+kind:'');
  st.innerHTML='<i></i> <span>'+msg+'</span>';
}

function aiAddMsg(who,html,src,related){
  var chat=document.getElementById('chat');
  var w=document.createElement('div');w.className='msg '+who;
  w.innerHTML=html+(src?'<span class="ai-src">📖 '+aiEsc(src)+'</span>':'');
  if(related&&related.length){
    var rel=document.createElement('div');rel.className='ai-related';
    related.forEach(function(id){
      var e=KB[id];if(!e||id.indexOf('__')===0)return;
      var b=document.createElement('button');b.type='button';b.textContent='↳ '+(e.src||id);
      b.onclick=function(){aiAnswerId(id,e.src||id)};
      rel.appendChild(b);
    });
    if(rel.children.length)w.appendChild(rel);
  }
  chat.appendChild(w);chat.scrollTop=chat.scrollHeight;
  return w;
}
function aiTypingBubble(){
  var chat=document.getElementById('chat');
  var w=document.createElement('div');w.className='msg ai';
  w.innerHTML='<span class="ai-typing-dots"><span></span><span></span><span></span></span>';
  chat.appendChild(w);chat.scrollTop=chat.scrollHeight;return w;
}

function aiScore(text,e){
  var tk=aiToks(text),n=aiNorm(text),s=0;
  e.k.forEach(function(kw){
    kw=kw.toLowerCase();
    if(tk.indexOf(kw)>=0)s+=5;
    else if((kw.length>=4||kw.indexOf(' ')>=0)&&n.indexOf(kw)>=0)s+=(kw.indexOf(' ')>=0?8:4);
    else if(kw.length>=4&&tk.some(function(t){return t.length>=4&&(t.indexOf(kw)>=0||kw.indexOf(t)>=0)}))s+=2;
  });
  return s;
}
function aiFindAll(text){
  var out=[];
  for(var id in KB){if(id.indexOf('__')===0)continue;var s=aiScore(text,KB[id]);if(s>=2)out.push({id:id,s:s})}
  out.sort(function(a,b){return b.s-a.s});
  return out;
}
function aiIntent(t){
  t=aiNorm(t);
  if(/\b(vs|versus|difference|compare)\b|වෙනස|வித்தியாசம்/.test(t))return 'compare';
  if(/\b(error|issue|problem|fail|fix|blocked)\b|ගැටලු|දෝෂ|பிழை/.test(t))return 'trouble';
  if(/\b(how|steps|procedure|create|post)\b|කොහොම|පියවර|எப்படி/.test(t))return 'howto';
  if(/\b(why)\b|ඇයි|ஏன்/.test(t))return 'why';
  return 'general';
}
function aiBuild(id,lang,intent){
  var e=KB[id];if(!e)return null;
  var body=e[lang]||e.si||e.en||'';
  if(e.steps&&e.steps.length&&(intent==='howto'||intent==='general'||intent==='trouble'))
    body+='<ul class="ai-steps">'+e.steps.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>';
  return {html:body,src:e.src||'',related:e.rel||[]};
}
function aiCompose(text){
  var lang=aiLang(text),low=aiNorm(text);
  if(/(^|\s)(progress|certif\w*)(\s|$)/.test(low)||/ප්‍රගති|සහතික|முன்னேற்ற|சான்றிதழ்/.test(text))
    return {html:aiEsc(aiInsight()),src:'',related:[]};
  if(/^\s*(hi|hello|hey|ayubowan)\b|^\s*හායි|^\s*ආයුබෝවන්/i.test(text))return aiBuild('__greeting',lang,'general');
  if(/\b(thanks|thank you)\b|ස්තූතියි|நன்றி/i.test(text))return aiBuild('__thanks',lang,'general');
  var intent=aiIntent(text),hits=aiFindAll(text);
  if(!hits.length&&aiLast&&/^\s*(and|then|why|more)\b|^\s*(එතකොට|ඇයි|තව)/i.test(text))hits=[{id:aiLast,s:5}];
  if(hits.length){
    if(intent==='compare'){
      var top=hits.filter(function(h){return h.s>=5}).slice(0,3);
      if(top.length>=2){
        aiLast=top[0].id;
        var html='',rel=[];
        top.forEach(function(h,i){
          var e=KB[h.id];
          html+=(i?'<hr style="border:0;border-top:1px dashed var(--bd);margin:10px 0">':'')+'<b>'+aiEsc(e.src||h.id)+'</b><br>'+(e[lang]||e.si||e.en||'');
          rel=rel.concat(e.rel||[]);
        });
        return {html:html,src:'',related:rel.filter(function(x,i){return rel.indexOf(x)===i}).slice(0,4)};
      }
    }
    aiLast=hits[0].id;
    return aiBuild(hits[0].id,lang,intent);
  }
  var nf={
    si:'🤔 මට ඒ ගැන නිශ්චිත පිළිතුරක් නැහැ. T-code එකක් හෝ system නමක් එකතු කර නැවත අහන්න.<br><br>උදා: <i>"MIGO 101 error"</i>, <i>"Andon escalation"</i>, <i>"SAP MRP settings"</i>',
    en:'🤔 I do not have a specific answer for that. Add a T-code or system name and ask again.<br><br>e.g. <i>"MIGO 101 error"</i>, <i>"Andon escalation"</i>, <i>"SAP MRP settings"</i>',
    ta:'🤔 அதற்கு குறிப்பிட்ட பதில் என்னிடம் இல்லை. T-code அல்லது அமைப்பின் பெயரைச் சேர்த்து மீண்டும் கேளுங்கள்.'
  };
  return {html:nf[lang]||nf.si,src:'',related:['sap-grn','sap-miro','sap-error-stock','andon-howto','ai-prompt']};
}

function aiInsight(){
  var n=totalDone(),pct=Math.round(n/T.length*100);
  var pr=PRI[S.ly]||[];
  var miss=pr.filter(function(i){return !isDone(i)});
  if(n===0)return t('aiStart');
  if(miss.length===0)return t('aiPerfect').replace('{p}',pct);
  return t('aiProg').replace('{p}',pct).replace('{l}',miss.map(function(i){return T[i].n}).join(', '));
}

function aiRespond(getReply){
  aiBusy=true;
  aiStatus('thinking','Thinking…');
  var tb=aiTypingBubble();
  setTimeout(function(){
    tb.remove();
    try{var r=getReply();aiAddMsg('ai',r.html,r.src,r.related)}
    catch(err){aiAddMsg('ai','⚠️ Error. Please try again.',null,['sap-grn'])}
    aiStatus('','Ready · context memory active');
    aiBusy=false;
  },350+Math.random()*450);
}
function aiAsk(text){
  text=(text||'').trim();if(!text||aiBusy)return;
  aiAddMsg('me',aiEsc(text));
  aiRespond(function(){return aiCompose(text)});
}
function aiAnswerId(id,label){
  if(aiBusy)return;
  aiAddMsg('me',aiEsc(label));
  aiLast=id;
  aiRespond(function(){return aiBuild(id,S.lang,'howto')});
}
/* kept for the feedback form + chips: aiSay(text,true)=ask, aiSay(text,false)=coach note */
function aiSay(text,isUser){
  if(isUser){aiAsk(text)}
  else{aiAddMsg('ai',aiEsc(text))}
}
function aiGreet(){
  aiAddMsg('ai','👋 '+aiEsc(aiInsight())+'<br><br>'+(S.lang==='en'?'Ask me anything about <b>SAP, Oracle HCM, Andon, 3D, SharePoint, HRIS, AI or the Dashboard</b>. Follow-up questions work too.':S.lang==='ta'?'<b>SAP, Oracle HCM, Andon, 3D, SharePoint, HRIS, AI, Dashboard</b> பற்றி எதையும் கேளுங்கள்.':'<b>SAP, Oracle HCM, Andon, 3D, SharePoint, HRIS, AI, Dashboard</b> ගැන ඕනෑම දෙයක් අහන්න. Follow-up ප්‍රශ්නත් අහන්න පුළුවන්.'),null,['sap-grn','sap-miro','andon-howto','ai-security']);
}

function renderDev(){
  var n=totalDone(),pct=Math.round(n/T.length*100),qc=0;
  T.forEach(function(tl,i){var q=qz(i);tl.q.forEach(function(x,k){if(q[k]===x.a)qc++})});
  var rated=S.fb.filter(function(f){return f.r>0});
  var avg=rated.length?(rated.reduce(function(a,f){return a+f.r},0)/rated.length).toFixed(1):'–';
  var cs=CATS[S.lang]||CATS.si;
  var vals=CATMAP.map(function(m){return Math.round(m.filter(function(i){return isDone(i)}).length/m.length*100)});
  var cx=130,cy=125,R=88;
  function P(i,r){var a=(-90+72*i)*Math.PI/180;return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)}
  var svg='<svg viewBox="-40 -5 340 270" width="100%" style="max-width:340px">';
  [25,50,75,100].forEach(function(g){svg+='<polygon points="'+vals.map(function(_,i){return P(i,R*g/100)}).join(' ')+'" fill="none" stroke="var(--bd)"/>'});
  vals.forEach(function(_,i){svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+P(i,R).split(',')[0]+'" y2="'+P(i,R).split(',')[1]+'" stroke="var(--bd)"/>'});
  svg+='<polygon points="'+vals.map(function(v,i){return P(i,R*Math.max(v,4)/100)}).join(' ')+'" fill="rgba(227,30,36,.3)" stroke="var(--red)" stroke-width="2.5"/>';
  cs.forEach(function(c,i){var p=P(i,R+18).split(',');svg+='<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--tx)">'+c+'</text>'});
  svg+='</svg>';
  var cats=cs.map(function(c,i){return '<div class="brow"><span style="font-size:12.5px">'+c+'</span><div class="bar"><i style="width:'+vals[i]+'%"></i></div><b style="font-size:12px">'+vals[i]+'%</b></div>'}).join('');
  var cnt=[1,2,3,4,5].map(function(s){return rated.filter(function(f){return f.r===s}).length}),mx=Math.max.apply(null,cnt.concat([1]));
  var dist=cnt.map(function(c,i){return '<div class="brow"><span>'+(i+1)+' ★</span><div class="bar"><i style="width:'+(c/mx*100)+'%;background:var(--gold)"></i></div><b style="font-size:12px">'+c+'</b></div>'}).join('');
  var mn=Math.min.apply(null,vals),wi=vals.indexOf(mn);
  var ins=mn>=100?t('insightGood'):t('insightFocus').replace('{c}',cs[wi]);
  document.getElementById('t7').innerHTML='<div class="card"><h2>'+t('devTitle')+'</h2>'
   +'<div class="stat-tiles"><div class="stat-tile"><b>'+n+'/'+T.length+'</b><span>'+t('statTools')+'</span></div><div class="stat-tile"><b>'+qc+'</b><span>'+t('statQuiz')+'</span></div><div class="stat-tile"><b>'+pct+'%</b><span>'+t('statAvg')+'</span></div><div class="stat-tile"><b>'+avg+'</b><span>'+t('statFeedback')+'</span></div></div>'
   +'<div class="chart-grid"><div><h3>'+t('radarTitle')+'</h3><div class="radar-wrap">'+svg+'</div></div><div><h3>'+t('catTitle')+'</h3>'+cats+'<h3 style="margin-top:14px">'+t('fbDist')+'</h3>'+dist+'</div></div>'
   +'<div class="warn"><b>'+t('devInsight')+':</b> '+ins+'</div></div>';
}

function gMatch(){
  var en=S.lang==='en',idx=shuf([0,1,2,3,4,5,6,7]).slice(0,5),right=shuf(idx),selL=null,selR=null,done=0;
  var box=document.getElementById('gbox');
  box.innerHTML=gTop('🤖',t('gHint'))+'<div class="match-wrap"><div class="match-col">'+idx.map(function(i){return '<div class="match-item" data-s="L" data-i="'+i+'">'+T[i].i+' '+T[i].n+'</div>'}).join('')+'</div><div class="match-col">'+right.map(function(i){return '<div class="match-item" data-s="R" data-i="'+i+'">'+(en?E[i].k:T[i].k)+'</div>'}).join('')+'</div></div>';
  box.querySelectorAll('.match-item').forEach(function(el){el.onclick=function(){
    if(el.dataset.s==='L'){if(selL)selL.classList.remove('sel');selL=el}else{if(selR)selR.classList.remove('sel');selR=el}
