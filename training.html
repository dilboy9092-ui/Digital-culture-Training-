<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Culture Academy Training</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f4;--card:#fff;--tx:#262626;--mu:#6d6e71;--red:#e31e24;--gold:#d4af37;--bd:#e3e3e3;--ok:#1a8f4d;--soft:#fdeaea;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--card:#2a2a2a;--tx:#f2f2f2;--mu:#a7a9ac;--bd:#3d3d3d;--ok:#3ecf7a;--soft:#3a2223;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1b;--card:#2a2a2a;--tx:#f2f2f2;--mu:#a7a9ac;--bd:#3d3d3d;--ok:#3ecf7a;--soft:#3a2223;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Sans Sinhala","Iskoola Pota","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px;position:relative;z-index:2}
h1,h2,h3{font-family:Cambria,Georgia,"Noto Serif Sinhala",serif;margin:0 0 6px}
.hide{display:none!important}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{background:var(--red);color:#fff;font-weight:800;letter-spacing:1px;padding:6px 12px;border-radius:8px;font-family:Arial,sans-serif}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
#login{max-width:440px;margin:8vh auto 0}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:18px}
.btn.sm{width:auto;margin:0;padding:11px 16px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd);width:auto;margin:0;padding:8px 14px;font-weight:600}
.err{color:var(--red);min-height:1.4em;margin-top:8px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--red);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tool{text-align:left;cursor:pointer;font:inherit;color:inherit;display:block;width:100%}
.tool:hover{border-color:var(--red)}
.ic{font-size:30px;line-height:1}
.tool h3{font-size:17px;margin:8px 0 4px}
.tool .bar{margin-top:10px;height:6px}
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;background:var(--card)}
.steps input{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:2px;border:2px solid var(--bd);border-radius:8px;flex:none;cursor:pointer;position:relative;transition:all .2s}
.steps input:checked{background:var(--ok);border-color:var(--ok);animation:pop .4s}
.steps input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.lab{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:1px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.opt.good{border-color:var(--ok);background:var(--ok);color:#fff;animation:correctGlow .8s ease}
.opt.bad{border-color:var(--red)}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{flex:1 1 30%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;font-size:14px}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.kv{margin:0 0 12px}.kv b{color:var(--red)}
ul.b{padding-left:20px;margin:6px 0}
.star{background:var(--red);color:#fff}
.note{font-size:13px;color:var(--mu);margin-top:16px}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.lang button{padding:6px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.lang button.on{background:var(--red);border-color:var(--red);color:#fff}
ul.tips{list-style:none;padding-left:0}
ul.tips li{padding-left:26px;position:relative;margin:9px 0}
ul.tips li::before{content:"\2714";color:var(--ok);position:absolute;left:0;font-weight:700}
.warn{background:var(--soft);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;margin:12px 0}

/* BACKGROUND */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:520px;height:520px;left:-170px;top:-150px;background:radial-gradient(circle,#e31e24,transparent 70%);animation:drift1 22s ease-in-out infinite}
.b2{width:460px;height:460px;right:-150px;top:18%;background:radial-gradient(circle,#d4af37,transparent 70%);animation:drift2 27s ease-in-out infinite}
.b3{width:620px;height:620px;left:28%;bottom:-280px;background:radial-gradient(circle,#6d6e71,transparent 72%);animation:drift3 33s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(110px,80px) scale(1.22)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-120px,90px) scale(.88)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,-110px) scale(1.18)}}
.grid-lines{position:absolute;inset:-40%;background-image:linear-gradient(rgba(227,30,36,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(109,110,113,.055) 1px,transparent 1px);background-size:48px 48px;animation:gridPan 40s linear infinite;transform:perspective(600px) rotateX(12deg)}
@keyframes gridPan{to{background-position:48px 48px,48px 48px}}
.scanline{position:absolute;left:0;right:0;height:160px;background:linear-gradient(180deg,transparent,rgba(227,30,36,.10),transparent);animation:scanMove 11s linear infinite}
@keyframes scanMove{0%{top:-20%}100%{top:120%}}
#floaters{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.floater{position:absolute;bottom:-50px;opacity:.22;animation:floatUp linear infinite;filter:grayscale(.2)}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.28}90%{opacity:.16}100%{transform:translateY(-118vh) rotate(400deg);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes correctGlow{0%{box-shadow:0 0 0 0 rgba(26,143,77,.7)}100%{box-shadow:0 0 0 18px rgba(26,143,77,0)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes iconBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-4deg)}}
section.in{animation:fadeUp .4s ease}
.tool{transition:transform .18s,box-shadow .18s,border-color .18s;animation:fadeUp .45s ease both}
.tool:hover{transform:translateY(-5px);box-shadow:0 10px 26px rgba(227,30,36,.20)}
.tool:hover .ic{animation:iconBob .7s ease-in-out infinite}
.tool:active,.btn:active,.tab:active,.opt:active{transform:scale(.96)}
.opt,.btn,.tab{transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
.opt:hover{border-color:var(--red);transform:translateX(3px)}
.opt.pop{animation:pop .45s}
.opt.shake{animation:shake .45s;border-color:var(--red);background:var(--soft)}
.steps li{transition:transform .15s,background .2s}
.steps li:hover{transform:translateX(3px)}
.steps li:has(input:checked){background:linear-gradient(90deg,rgba(26,143,77,.10),transparent)}

#wel{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);animation:fadeIn .3s}
#wel.out{opacity:0;transition:opacity .5s}
.wbox{background:var(--card);padding:30px 36px;border-radius:20px;text-align:center;max-width:90%;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
.wbox h2{font-size:26px}
.wave{font-size:58px;display:inline-block;animation:wave 1.4s ease-in-out infinite;transform-origin:70% 70%}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cf{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}

.hero{display:block;width:100%;max-height:120px;color:var(--red);margin-bottom:10px}
.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#e31e24,#7d0d12);color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .mu{color:#ffe4e4}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.hero2{position:absolute;right:120px;bottom:0;height:100%;width:210px;color:#fff;opacity:.25;pointer-events:none}
.top>div{position:relative}
#login .card{border-top:6px solid var(--red);box-shadow:0 10px 30px rgba(0,0,0,.12)}

.chart{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.bars{flex:1;min-width:250px}
.brow{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;margin:9px 0;font-size:14px}
.brow .bar{height:12px}
.donut{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;position:relative;flex:none;transition:background 1s}
.donut::before{content:"";position:absolute;inset:14px;background:var(--card);border-radius:50%}
.donut b{position:relative;font-size:22px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.stat-tile{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.stat-tile b{display:block;font-size:22px;color:var(--red)}
.stat-tile span{font-size:11.5px;color:var(--mu)}

/* GAMES (cards) */
.toon{background:linear-gradient(#bfe9ff,#fff7d6);border:4px solid #262626;border-radius:22px;box-shadow:6px 6px 0 #262626;font-family:'Comic Sans MS','Chalkboard SE','Marker Felt',cursive,sans-serif;color:#262626}
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.game-card{font:inherit;text-align:left;background:#fff;color:#262626;border:3px solid #262626;border-radius:18px;box-shadow:4px 4px 0 #262626;padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.game-card:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 #262626}
.game-card:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 #262626}
.game-card:disabled{cursor:not-allowed}
.game-card .gicon{font-size:38px;display:inline-block;animation:iconBob 2s ease-in-out infinite}
.game-card h3{margin:6px 0 2px;font-size:17px}

/* AI COACH v2 */
.ai-card{background:linear-gradient(150deg,rgba(227,30,36,.09),var(--card) 45%,rgba(212,175,55,.10))}
.ai-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ai-ava{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--red),#7d0d12);box-shadow:0 6px 18px rgba(227,30,36,.35);animation:iconBob 3.4s ease-in-out infinite}
.ai-ava .ping{position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.35);opacity:.95}100%{transform:scale(2.6);opacity:0}}
.ai-status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--mu);padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:10px;border:1px solid var(--bd)}
.ai-status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.4s infinite}
.ai-status.thinking i{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:blink .6s infinite}
.ai-status.error i{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
.chat{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:8px 4px 12px;scroll-behavior:smooth}
.msg{max-width:88%;padding:12px 15px;border-radius:14px;font-size:14.5px;line-height:1.65;animation:fadeUp .35s ease both;word-wrap:break-word}
.msg b{color:var(--red)}
.msg code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:13px;color:var(--red)}
.msg.ai{background:var(--bg);border:1px solid var(--bd);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--red);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg.me b{color:#fff}
.msg .ai-src{display:block;font-size:11px;color:var(--mu);margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.msg ul.ai-steps{padding-left:18px;margin:6px 0 0}
.msg ul.ai-steps li{margin:3px 0;font-size:13.5px}
.msg .ai-typing-dots{display:inline-flex;gap:4px;padding:4px 0}
.msg .ai-typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:typDots 1.3s infinite}
.msg .ai-typing-dots span:nth-child(2){animation-delay:.18s}
.msg .ai-typing-dots span:nth-child(3){animation-delay:.36s}
@keyframes typDots{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.msg .ai-related{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg .ai-related button{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-weight:600;transition:.15s}
.msg .ai-related button:hover{background:var(--red);color:#fff;border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.chips button{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;transition:.2s}
.chips button:hover{background:var(--red);color:#fff;border-color:var(--red);transform:translateY(-2px)}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{flex:1;min-height:44px;max-height:120px;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx);resize:none;font-family:inherit}
.ai-foot{margin-top:8px;text-align:right}
.stars{display:flex;gap:6px;margin:8px 0 4px}
.stars button{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--bd);transition:.15s;padding:0}
.stars button.on{color:var(--gold);animation:pop .35s}
.stars button:hover{transform:scale(1.18)}
.fb-item{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px;background:var(--bg);animation:fadeUp .35s ease both}
.fb-item .fs{color:var(--gold);letter-spacing:2px}
textarea{min-height:88px;resize:vertical;font-family:inherit}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);background:var(--ok);color:#fff;padding:13px 22px;border-radius:30px;font-weight:700;z-index:70;box-shadow:0 10px 28px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.2,1.4,.4,1);font-size:14px}
#toast.show{transform:translateX(-50%) translateY(0)}

/* CERTIFICATE */
.certificate *{margin:0;padding:0;box-sizing:border-box}
.certificate{width:1123px;height:794px;background:#fff;position:relative;padding:45px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.15);font-family:'Inter',system-ui,sans-serif;line-height:normal;font-size:16px;color:#222;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.certificate .outer-border{position:absolute;inset:15px;border:3px solid #a71925}
.certificate .inner-border{position:absolute;inset:23px;border:1px solid #d4af37}
.certificate .top-line{width:180px;height:5px;background:#a71925;margin:20px auto}
.certificate .academy{text-align:center;color:#222;font-size:18px;font-weight:700;letter-spacing:5px;margin-top:25px}
.certificate .dca-logo{text-align:center;font-size:35px;font-weight:700;color:#a71925;margin-top:12px}
.certificate .dca-logo span{color:#d4af37}
.certificate .content{text-align:center;position:relative;z-index:2}
.certificate .level{display:inline-block;background:#a71925;color:#fff;padding:9px 35px;font-size:13px;letter-spacing:3px;margin-top:20px}
.certificate .title{font-family:'Playfair Display',Georgia,serif;font-size:48px;color:#171717;margin-top:20px;letter-spacing:2px;font-weight:700}
.certificate .subtitle{font-size:15px;color:#777;letter-spacing:4px;margin-top:8px}
.certificate .presented{font-size:16px;color:#555;margin-top:28px}
.certificate .employee-name{font-family:'Playfair Display',Georgia,serif;font-size:39px;color:#a71925;margin-top:15px;border-bottom:2px solid #d4af37;display:inline-block;padding:0 65px 10px;font-weight:700}
.certificate .description{width:750px;margin:20px auto;font-size:15px;line-height:1.8;color:#555}
.certificate .training{margin:22px auto;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:940px}
.certificate .training-item{background:#f8f5f5;border-left:4px solid #a71925;padding:11px 20px;min-width:200px;font-size:13px;color:#333;font-weight:600}
.certificate .footer{display:flex;justify-content:space-around;margin-top:36px;padding:0 60px}
.certificate .signature{width:230px;text-align:center}
.certificate .signature-line{border-top:1px solid #555;margin-bottom:10px}
.certificate .signature h4{font-size:13px;color:#222}
.certificate .signature p{font-size:11px;color:#888;margin-top:5px}
.certificate .seal{position:absolute;right:80px;bottom:85px;width:90px;height:90px;border:3px solid #d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#a71925;font-size:11px;font-weight:700;transform:rotate(-12deg)}
#certwrap{transform-origin:top left;width:1123px;margin:0 auto}
@media print{body{background:#fff!important}body *{visibility:hidden}#certwrap,#certwrap *{visibility:visible}#certwrap{position:absolute!important;left:0;top:0;width:1123px!important;height:794px!important;overflow:visible!important;transform:none!important}#certwrap .certificate{transform:none!important;box-shadow:none!important}@page{size:A4 landscape;margin:0}}

/* GAME MODAL */
#cyberWrap{position:fixed;inset:0;z-index:100;background:#04050a;display:flex;flex-direction:column}
.cy-bar{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#0a1220;color:#00e5ff;font-weight:800;letter-spacing:2px;font-size:13px;border-bottom:1px solid rgba(0,229,255,.3)}
.cy-bar button{background:#ff2b4d;color:#fff;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:800;cursor:pointer}
#cyberFrame{flex:1;width:100%;border:0;background:#04050a}

@media(max-width:520px){.brow{grid-template-columns:100px 1fr 40px;font-size:13px}.hero2{display:none}.msg{max-width:94%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bgfx" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-lines"></div>
  <div class="scanline"></div>
</div>
<div id="floaters" aria-hidden="true"></div>

.tray-head{display:flex;align-items:center;gap:10px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:2.5px;color:rgba(0,229,255,.95);margin-bottom:9px;padding-bottom:7px;border-bottom:1px dashed rgba(0,229,255,.16)}
.cables{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cable{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(0,0,0,.44));border:1px solid rgba(0,229,255,.5);cursor:grab;touch-action:none;font-weight:700;font-size:12.5px;transition:.15s}
.cable:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,229,255,.4)}
.cable.dragging{opacity:.22}
.cable.done{animation:cableOut .4s ease forwards;pointer-events:none}
@keyframes cableOut{100%{transform:scale(.3);opacity:0;margin:-4px -5px;padding:0;width:0;border-width:0}}
.cable.ghost{position:fixed;z-index:9999;pointer-events:none;transform:scale(1.1) rotate(-3deg)}
.overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 45%,rgba(6,14,24,.94),rgba(2,4,8,.985))}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.panel{max-width:560px;width:100%;border-radius:18px;padding:26px 24px;text-align:center;background:linear-gradient(165deg,rgba(12,22,36,.98),rgba(4,7,13,.99));border:1px solid rgba(0,229,255,.38)}

.rules{text-align:left;margin:0 auto 20px;max-width:440px;display:grid;gap:10px}

.btn{font-family:'Orbitron',sans-serif;font-weight:900;font-size:13px;letter-spacing:3px;text-transform:uppercase;padding:13px 34px;border-radius:10px;cursor:pointer;color:#04121a;border:0;background:linear-gradient(135deg,#00e5ff,#39ff14)}
@media (max-width:620px){.rear-panels{grid-template-columns:1fr}.cpu-rear .ports{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

      <div class="rule"><span class="n">02</span><span>Power + HDMI දෙකම connect වුනාම boot වෙනවා</span></div>

<script>
(function(){
'use strict';
var $ = function(id){return document.getElementById(id);};
var ALL_CABLES={
 'c-mon-power':{name:'Monitor Power',icon:'⚡',target:'mon-power'},
 'c-cpu-power':{name:'PC Power Cord',icon:'🔌',target:'cpu-power'},
 'c-hdmi-mon':{name:'HDMI Monitor End',icon:'📺',target:'mon-hdmi'},
 'c-hdmi-cpu':{name:'HDMI PC End',icon:'🖥',target:'cpu-hdmi'},
 'c-kb':{name:'Keyboard USB',icon:'⌨',target:'cpu-usb-kb'},
 'c-mouse':{name:'Mouse USB',icon:'🖱',target:'cpu-usb-mouse'},
 'c-audio':{name:'Audio Jack',icon:'🎧',target:'cpu-audio'},
 'c-lan':{name:'LAN Cable',icon:'🌐',target:'cpu-lan'}
};
var MON_PORTS=[{id:'mon-power',label:'DC IN'},{id:'mon-hdmi',label:'HDMI'},{id:'mon-audio',label:'AUDIO'},{id:'mon-vga',label:'VGA'}];
var CPU_PORTS=[{id:'cpu-power',label:'AC IN'},{id:'cpu-hdmi',label:'HDMI'},{id:'cpu-lan',label:'LAN'},{id:'cpu-usb-kb',label:'USB KB'},{id:'cpu-usb-mouse',label:'USB MOUSE'},{id:'cpu-audio',label:'AUDIO'},{id:'cpu-vga',label:'VGA'}];
var state={score:0,combo:0,connected:0,errors:0,powered:false,monPowered:false,hdmiOn:false,booting:false,booted:false,connectedPorts:{}};
var el={hudScore:$('hudScore'),hudProgress:$('hudProgress'),hudCombo:$('hudCombo'),scene:$('scene'),monitorVis:$('monitorVis'),tower:$('tower'),screen:$('screen'),screenContent:$('screenContent'),monPorts:$('monPorts'),cpuPorts:$('cpuPorts'),cables:$('cables'),trayCount:$('trayCount'),startOv:$('startOverlay'),winOv:$('winOverlay'),winScore:$('winScore'),winTitle:$('winTitle'),startBtn:$('startBtn'),retryBtn:$('retryBtn')};
function buildPorts(){el.monPorts.innerHTML='';el.cpuPorts.innerHTML='';MON_PORTS.forEach(function(p){var d=document.createElement('div');d.className='port';d.dataset.port=p.id;d.innerHTML='<div class="hole"></div><span class="port-name">'+p.label+'</span>';el.monPorts.appendChild(d);});CPU_PORTS.forEach(function(p){var d=document.createElement('div');d.className='port';d.dataset.port=p.id;d.innerHTML='<div class="hole"></div><span class="port-name">'+p.label+'</span>';el.cpuPorts.appendChild(d);});}
function buildCables(){el.cables.innerHTML='';Object.keys(ALL_CABLES).forEach(function(id){var c=ALL_CABLES[id];var e=document.createElement('div');e.className='cable';e.dataset.id=id;e.innerHTML='<span class="ico">'+c.icon+'</span><span class="txt">'+c.name+'</span>';el.cables.appendChild(e);});updateTray();}
function updateTray(){el.trayCount.textContent=el.cables.querySelectorAll('.cable:not(.done)').length+' LEFT';}
function updateHUD(){el.hudScore.textContent=state.score;el.hudProgress.textContent=state.connected+'/8';el.hudCombo.textContent='x'+Math.max(1,Math.min(state.combo,5));}
function renderScreen(){var sc=el.screen,cc=el.screenContent;if(!state.monPowered){sc.className='screen';cc.innerHTML='';return;}if(state.booted){sc.className='screen';cc.innerHTML='<div style="font-family:Orbitron;color:#00e5ff;font-size:24px;text-shadow:0 0 20px #00e5ff">CYBER OS</div>';return;}if(state.booting){sc.className='screen';cc.innerHTML='<div style="color:#00e5ff;font-family:Orbitron;font-size:12px">BOOTING...</div>';return;}sc.className='screen nosignal';cc.innerHTML='<div style="color:#789;font-family:Orbitron;font-size:13px;letter-spacing:3px">NO SIGNAL</div>';}
function startBoot(){state.booting=true;renderScreen();setTimeout(function(){state.booting=false;state.booted=true;renderScreen();winLevel();},2000);}
function winLevel(){state.finished=true;el.winScore.textContent=state.score;el.winTitle.textContent='MISSION COMPLETE';el.winOv.classList.remove('hidden');}
var dragging=null,ghost=null,gdx=0,gdy=0;
el.cables.addEventListener('pointerdown',function(e){var c=e.target.closest('.cable');if(!c||c.classList.contains('done'))return;e.preventDefault();dragging=c;var r=c.getBoundingClientRect();gdx=e.clientX-r.left;gdy=e.clientY-r.top;ghost=c.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';document.body.appendChild(ghost);c.classList.add('dragging');});
document.addEventListener('pointermove',function(e){if(!dragging||!ghost)return;e.preventDefault();ghost.style.left=(e.clientX-gdx)+'px';ghost.style.top=(e.clientY-gdy)+'px';});
document.addEventListener('pointerup',function(e){if(!dragging||!ghost)return;var c=dragging,data=ALL_CABLES[c.dataset.id];ghost.style.display='none';var under=document.elementFromPoint(e.clientX,e.clientY);var p=under?under.closest('.port'):null;ghost.remove();ghost=null;c.classList.remove('dragging');dragging=null;if(!p||p.classList.contains('connected'))return;if(p.dataset.port===data.target){p.classList.add('connected');state.connected++;state.combo++;state.score+=100*Math.min(state.combo,5);c.classList.add('done');setTimeout(function(){c.remove();updateTray();},400);updateTray();if(p.dataset.port==='cpu-power'){state.powered=true;el.tower.classList.add('powered');}if(p.dataset.port==='mon-power'){state.monPowered=true;}if(p.dataset.port==='mon-hdmi'||p.dataset.port==='cpu-hdmi'){state.hdmiOn=true;}if(state.powered&&state.monPowered&&state.hdmiOn&&!state.booting&&!state.booted){startBoot();}renderScreen();updateHUD();}else{state.combo=0;state.errors++;state.score=Math.max(0,state.score-50);updateHUD();}});
el.startBtn.addEventListener('click',function(){el.startOv.classList.add('hidden');buildPorts();buildCables();updateHUD();renderScreen();});
el.retryBtn.addEventListener('click',function(){location.reload();});
buildPorts();buildCables();updateHUD();renderScreen();
})();
<\/script>
</body>
</html>
</script>

var FB_CATS={si:['අන්තර්ගතය','පරිශීලක අත්දැකීම','තාක්ෂණික ගැටලු','වෙනත්'],en:['Content','User experience','Technical issue','Other'],ta:['உள்ளடக்கம்','பயனர் அனுபவம்','தொழில்நுட்ப சிக்கல்','மற்றவை']};

/* ============================================================
   STATE
   ============================================================ */
var lang='si';
var user={name:'',ep:'',company:'',layer:0};
var progress={};
var curTopic=0;
var quizState={qIdx:0,score:0};

var $=function(id){return document.getElementById(id);};
var $$=function(sel){return document.querySelectorAll(sel);};

/* ============================================================
   STORAGE
   ============================================================ */
function saveUser(){try{localStorage.setItem('dca_user',JSON.stringify(user));}catch(e){}}
function loadUser(){try{var s=localStorage.getItem('dca_user');if(s)user=JSON.parse(s);}catch(e){}}
function saveProgress(){try{localStorage.setItem('dca_progress',JSON.stringify(progress));}catch(e){}}
function loadProgress(){try{var s=localStorage.getItem('dca_progress');if(s)progress=JSON.parse(s);}catch(e){}}
function saveFeedback(arr){try{localStorage.setItem('dca_feedback',JSON.stringify(arr));}catch(e){}}
function loadFeedback(){try{var s=localStorage.getItem('dca_feedback');return s?JSON.parse(s):[];}catch(e){return[];}}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show');},2200);}
function confetti(){var fx=$('fx');for(var i=0;i<50;i++){var c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=['#e31e24','#d4af37','#1a8f4d','#2b6bd4'][i%4];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.5)+'s';fx.appendChild(c);setTimeout(function(){c.remove();},4500);}}
function applyI18n(){var d=I[lang];$$('[data-i]').forEach(function(el){var k=el.dataset.i;if(d[k]!=null)el.textContent=d[k];});$('aiTitle').textContent=d.aiTitle;$('aiSub').textContent=d.aiSub;$('fbTitle').textContent=d.fbTitle;$('fbSub').textContent=d.fbSub;$('fbCatL').textContent=d.fbCatL;$('fbTxtL').textContent=d.fbTxtL;$('fbSend').textContent=d.fbSend;var sel=$('fbCat');sel.innerHTML='';FB_CATS[lang].forEach(function(c){var o=document.createElement('option');o.textContent=c;sel.appendChild(o);});}

/* ============================================================
   LOGIN
   ============================================================ */
function initLogin(){
  var lySel=$('ly');lySel.innerHTML='';LY[lang].forEach(function(v,i){var o=document.createElement('option');o.value=i;o.textContent=v;lySel.appendChild(o);});
  $('co').addEventListener('change',function(){var v=this.value;$('co2').classList.toggle('hide',v!=='_o');});
  $('go').addEventListener('click',function(){
    var co=$('co').value==='_o'?$('co2').value.trim():$('co').value;
    var nm=$('nm').value.trim();
    var ep=$('ep').value.trim();
    var ly=parseInt($('ly').value,10);
    if(!nm){$('err').textContent=lang==='si'?'නම ඇතුළත් කරන්න':lang==='ta'?'பெயரை உள்ளிடுங்கள்':'Please enter your name';return;}
    if(!/^[0-9]{3,}$/.test(ep)){$('err').textContent=lang==='si'?'EPF අංකය වැරදියි':lang==='ta'?'EPF எண் தவறு':'Invalid EPF number';return;}
    $('err').textContent='';
    user={name:nm,ep:ep,company:co,layer:ly};saveUser();
    showWelcome();
    setTimeout(enterHome,1400);
  });
}

function showWelcome(){
  var w=$('wel');$('wt').textContent=(I[lang].hi)+user.name;
  $('ws').textContent=LY[lang][user.layer];
  w.classList.remove('hide');
  setTimeout(function(){w.classList.add('out');setTimeout(function(){w.classList.add('hide');w.classList.remove('out');},500);},1200);
}

/* ============================================================
   HOME
   ============================================================ */
function enterHome(){
  $('login').classList.add('hide');
  $('home').classList.remove('hide');
  $('hi').textContent=user.name;
  $('subline').textContent=user.company+' · '+LY[lang][user.layer];
  loadProgress();
  renderGrid();
  updateProgressBar();
  renderCert();
  renderReport();
  renderGames();
  renderAnalytics();
  initAICoach();
  initFeedback();
}

function renderGrid(){
  var grid=$('grid');grid.innerHTML='';
  var order=PRI[user.layer]||[0,1,2,3,4,5,6,7];
  order.forEach(function(idx){
    var t=T[idx];
    var pr=progress[idx]||{};
    var pct=((pr.s1?1:0)+(pr.s2?1:0)+(pr.s3?1:0))/3*100;
    var done=pr.s1&&pr.s2&&pr.s3;
    var card=document.createElement('button');
    card.className='tool card';
    card.innerHTML='<div class="ic">'+t.i+'</div><h3>'+esc(t.n)+'</h3><div class="mu" style="font-size:13px">'+esc(t.u)+'</div><div style="margin-top:8px"><span class="chip'+(done?' star':'')+'">'+(done?I[lang].done:esc(t.w))+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
    card.addEventListener('click',function(){openModule(idx);});
    grid.appendChild(card);
  });
}

function updateProgressBar(){
  var total=0,done=0;
  Object.keys(progress).forEach(function(k){var p=progress[k];total+=3;done+=(p.s1?1:0)+(p.s2?1:0)+(p.s3?1:0);});
  var pct=total?Math.round(done/total*100):0;
  $('tb').style.width=pct+'%';
  $('tp').textContent=pct+'% ('+done+'/8 topics)';
}

/* ============================================================
   MODULE
   ============================================================ */
function openModule(idx){
  curTopic=idx;quizState={qIdx:0,score:0};
  var t=T[idx],d=I[lang],pr=progress[idx]||{};
  $('home').classList.add('hide');$('mod').classList.remove('hide');
  $('mi').textContent=t.i;$('mn').textContent=t.n;$('mw').textContent=t.w;
  var html='<p class="kv"><b>'+d.who+':</b> '+esc(t.u)+'</p>';
  html+='<p class="kv"><b>'+d.top+':</b></p><ul class="b">'+t.top.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  html+='<p class="kv"><b>'+d.fmt+':</b> '+esc(t.f)+'</p>';
  html+='<p class="kv"><b>'+d.kpi+':</b> '+esc(t.k)+'</p>';
  html+='<p class="kv"><b>'+d.tips+':</b></p><ul class="tips">'+t.tips.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  $('mb').innerHTML=html;
  var sLabels=[d.s1,d.s2,d.s3];
  $('ms').innerHTML=sLabels.map(function(lbl,i){
    var k='s'+(i+1);
    return '<li><input type="checkbox" data-k="'+k+'" '+(pr[k]?'checked':'')+'><span>'+esc(lbl)+'</span></li>';
  }).join('');
  $$('#ms input').forEach(function(inp){
    inp.addEventListener('change',function(){
      progress[idx]=progress[idx]||{};progress[idx][this.dataset.k]=this.checked;saveProgress();updateProgressBar();
      if(progress[idx].s1&&progress[idx].s2&&progress[idx].s3){toast(I[lang].done);confetti();renderCert();renderReport();renderAnalytics();}
    });
  });
  renderQuiz();
}
function renderQuiz(){
  var t=T[curTopic];var d=I[lang];var q=t.q[quizState.qIdx];
  if(!q){$('mq').innerHTML='<p class="kv"><b>'+d.quiz+':</b> '+quizState.score+' / '+t.q.length+'</p>';return;}
  var html='<p class="lab">'+d.quiz+' · '+(quizState.qIdx+1)+'/'+t.q.length+'</p><p style="font-weight:600;margin:10px 0">'+esc(q.q)+'</p>';
  q.o.forEach(function(o,i){html+='<button class="opt" data-i="'+i+'">'+esc(o)+'</button>';});
  $('mq').innerHTML=html;
  $$('#mq .opt').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(this.dataset.i,10);
      $$('#mq .opt').forEach(function(x){x.disabled=true;});
      if(i===q.a){this.classList.add('good','pop');quizState.score++;}
      else{this.classList.add('bad','shake');$$('#mq .opt')[q.a].classList.add('good');}
      setTimeout(function(){quizState.qIdx++;renderQuiz();},900);
      progress[curTopic]=progress[curTopic]||{};progress[curTopic].quiz=Math.round(quizState.score/t.q.length*100);saveProgress();
    });
  });
}

/* ============================================================
   CERTIFICATE
   ============================================================ */
function renderCert(){
  var d=I[lang];
  var priority=PRI[user.layer].slice(0,2);
  var unlocked=priority.every(function(i){var p=progress[i]||{};return p.s1&&p.s2&&p.s3;});
  var html='<div class="card"><h3>'+d.certTitle+'</h3>';

var aiState={history:[],lastTopic:null,busy:false,initialized:false};

function initAICoach(){
  if(aiState.initialized)return;
  aiState.initialized=true;
  aiGreeting();
  $('aiSend').addEventListener('click',aiSend);
  $('aiIn').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
  $('aiIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend();}});
  $('aiClear').addEventListener('click',function(){aiState.history=[];aiState.lastTopic=null;$('chat').innerHTML='';aiGreeting();$('aiStatus').innerHTML='<i></i> <span>Ready</span>';});
  var chips=['MIGO 101 vs 122?','Andon escalation?','MRP settings','Oracle leave','AI security','SAP error fix'];
  chips.forEach(function(c){var b=document.createElement('button');b.textContent=c;b.addEventListener('click',function(){$('aiIn').value=c;aiSend();});$('aiChips').appendChild(b);});
}

function aiGreeting(){
  aiAddMsg('ai','👋 ආයුබෝවන්! මම ඔබේ <b>AI Training Coach</b>. SAP, Oracle HCM, Andon, 3D, SharePoint, HRIS, AI, Dashboard — ඕනෑම ගැන අහන්න. Follow-up ප්‍රශ්නත් අහන්න පුළුවන්.',null,['sap-grn','sap-miro','andon-howto','ai-security']);
}

function aiAddMsg(who,html,src,related){
  var w=document.createElement('div');w.className='msg '+who;
  w.innerHTML=html+(src?'<span class="ai-src">📖 Source: '+src+'</span>':'');
  if(related&&related.length){
    var rel=document.createElement('div');rel.className='ai-related';
    related.forEach(function(id){var e=KB[id];if(!e)return;var label=(e.si||e.en||'').replace(/<[^>]+>/g,'').slice(0,45)+'…';var b=document.createElement('button');b.textContent='↳ '+label;b.addEventListener('click',function(){$('aiIn').value=label;aiSend();});rel.appendChild(b);});
    w.appendChild(rel);
  }
  $('chat').appendChild(w);$('chat').scrollTop=$('chat').scrollHeight;
}
function aiTyping(){var w=document.createElement('div');w.className='msg ai';w.innerHTML='<span class="ai-typing-dots"><span></span><span></span><span></span></span>';$('chat').appendChild(w);$('chat').scrollTop=$('chat').scrollHeight;return w;}

function detectLang(t){if(/[\u0D80-\u0DFF]/.test(t))return 'si';if(/[\u0B80-\u0BFF]/.test(t))return 'ta';return 'en';}
function norm(s){return (s||'').toLowerCase().replace(/[^\w\s\u0D80-\u0DFF\u0B80-\u0BFF]/g,' ');}
function toks(s){return norm(s).split(/\s+/).filter(function(w){return w.length>1;});}
function detectIntent(t){t=norm(t);if(/(how|කොහොමද|கொஹொம்ட|steps|procedure)/.test(t))return 'howto';if(/(error|issue|problem|fail|fix|ගැටලුව|பிழை)/.test(t))return 'trouble';if(/(difference|vs|වෙනස)/.test(t))return 'compare';if(/(why|ඇයි|ஏன்)/.test(t))return 'why';return 'general';}
function findBest(text){
  var tk=toks(text),best=null,bs=0;
  for(var id in KB){
    var e=KB[id],s=0;
    e.k.forEach(function(kw){kw=kw.toLowerCase();if(tk.some(function(t){return t===kw;}))s+=5;else if(tk.some(function(t){return t.indexOf(kw)>=0||kw.indexOf(t)>=0;}))s+=2;});
    if(s>bs){bs=s;best={id:id,entry:e};}
  }
  return bs>=2?best:null;
}
function aiCompose(text,lang){
  if(/^(hi|hello|hey|ayubowan|හායි)\b/i.test(text))return aiBuild('__greeting',lang,'general');
  if(/\b(thanks|thank you|ස්තූතියි)\b/i.test(text))return aiBuild('__thanks',lang,'general');
  var intent=detectIntent(text),best=findBest(text);
  if(!best&&aiState.lastTopic&&/^(and|then|එතකොට|why|ඇයි)/i.test(text))return aiBuild(aiState.lastTopic,lang,'howto');
  if(best){aiState.lastTopic=best.id;return aiBuild(best.id,lang,intent);}
  return {html:lang==='en'?'🤔 Try: "MIGO 101 error", "Andon escalation", "SAP MRP".':lang==='ta'?'🤔 Try a T-code or system name.':'🤔 T-code එකක් හෝ system name එකක් එකතු කරලා නැවත අහන්න.<br><br>උදා: <i>"MIGO 101 error"</i>, <i>"Andon escalation"</i>, <i>"SAP MRP settings"</i>',src:'',related:['sap-grn','sap-miro','sap-error-stock','andon-howto','ai-prompt']};
}
function aiBuild(id,lang,intent){
  var e=KB[id];if(!e)return aiCompose('',lang);
  var body=e[lang]||e.si||e.en||'';
  if(e.steps&&e.steps.length&&(intent==='howto'||intent==='general'))body+='<ul class="ai-steps">'+e.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';
  return {html:body,src:e.src||'',related:e.rel||[]};
}
function aiSend(){
  var txt=$('aiIn').value.trim();if(!txt||aiState.busy)return;
  aiState.busy=true;$('aiIn').value='';$('aiIn').style.height='auto';
  aiAddMsg('me',esc(txt));
  aiState.history.push({role:'user',content:txt});
  var st=$('aiStatus');st.className='ai-status thinking';st.innerHTML='<i></i> <span>Thinking…</span>';
  var tb=aiTyping();
  setTimeout(function(){
    tb.remove();
    try{var rep=aiCompose(txt,detectLang(txt));aiAddMsg('ai',rep.html,rep.src,rep.related);}
    catch(err){aiAddMsg('ai','⚠️ Error processing. Try again.',null,['sap-grn','__greeting']);}
    st.className='ai-status';st.innerHTML='<i></i> <span>Ready · context memory active</span>';
    aiState.busy=false;$('aiIn').focus();
  },400+Math.random()*500);
}

/* ============================================================
   FEEDBACK
   ============================================================ */
var fbState={stars:0};
function initFeedback(){
  var stars=$('fbStars').children;
  for(var i=0;i<stars.length;i++){
    (function(i){stars[i].addEventListener('click',function(){fbState.stars=i+1;for(var j=0;j<stars.length;j++)stars[j].classList.toggle('on',j<=i);});})(i);
  }
  $('fbSend').addEventListener('click',function(){
    var txt=$('fbTxt').value.trim();
    if(!fbState.stars){toast('⭐ Select rating');return;}
    if(!txt){toast('✍️ Write feedback');return;}
    var arr=loadFeedback();
    arr.unshift({v:fbState.stars,cat:$('fbCat').value,txt:txt,name:user.name,ts:Date.now()});
    saveFeedback(arr);renderFbList();
    $('fbTxt').value='';fbState.stars=0;for(var j=0;j<stars.length;j++)stars[j].classList.remove('on');
    toast('✅ Feedback saved');confetti();
  });
  renderFbList();
}
function renderFbList(){
  var arr=loadFeedback(),list=$('fbList');
  if(!arr.length){list.innerHTML='<p class="mu" style="margin-top:12px;font-size:13px">No feedback yet</p>';return;}
  list.innerHTML=arr.slice(0,5).map(function(f){return '<div class="fb-item"><div class="fs">'+('★'.repeat(f.v))+('☆'.repeat(5-f.v))+'</div><b>'+esc(f.cat)+'</b><p style="margin:4px 0">'+esc(f.txt)+'</p><small class="mu">— '+esc(f.name)+'</small></div>';}).join('');
}

/* ============================================================
   TAB SWITCH
   ============================================================ */
function initTabs(){
  $$('.tab').forEach(function(b){
    b.addEventListener('click',function(){
      $$('.tab').forEach(function(x){x.classList.remove('on');});this.classList.add('on');
      var id=this.dataset.t;
      ['t1','t2','t3','t4','t5','t6','t7','t8'].forEach(function(tid){$(tid).classList.toggle('hide',tid!==id);});
      if(id==='t6')renderAnalytics();
      if(id==='t8')renderReport();
      if(id==='t4')renderCert();
    });
  });
}

/* ============================================================
   LANG SWITCH
   ============================================================ */
function initLang(){
  $$('.lang button').forEach(function(b){
    b.addEventListener('click',function(){
      lang=this.dataset.l;
      $$('.lang button').forEach(function(x){x.classList.remove('on');});this.classList.add('on');
      applyI18n();
      if(!$('home').classList.contains('hide')){
        $('subline').textContent=user.company+' · '+LY[lang][user.layer];
        renderGrid();renderCert();renderReport();renderGames();renderAnalytics();
      }
      var lySel=$('ly');lySel.innerHTML='';LY[lang].forEach(function(v,i){var o=document.createElement('option');o.value=i;o.textContent=v;lySel.appendChild(o);});
    });
  });
}

/* ============================================================
   FLOATERS
   ============================================================ */
function initFloaters(){
  var fl=$('floaters'),icons=['💠','⚙️','📊','🎯','🔷','✨','🎨','🧵'];
  for(var i=0;i<14;i++){
    var d=document.createElement('div');d.className='floater';d.textContent=icons[i%icons.length];
    d.style.left=Math.random()*100+'vw';d.style.fontSize=(20+Math.random()*30)+'px';
    d.style.animationDuration=(15+Math.random()*15)+'s';d.style.animationDelay=(Math.random()*10)+'s';
    fl.appendChild(d);
  }
}

/* ============================================================
   INIT
   ============================================================ */
function boot(){
  loadUser();
  loadProgress();
  initFloaters();
  initLogin();
  initLang();
  initTabs();
  $('out').addEventListener('click',function(){
    try{localStorage.removeItem('dca_user');}catch(e){}
    location.reload();
  });
  $('back').addEventListener('click',function(){
    $('mod').classList.add('hide');$('home').classList.remove('hide');renderGrid();updateProgressBar();
  });
  applyI18n();
  if(user.name){enterHome();$('login').classList.add('hide');}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
