/* ---------------- 2. INTENT + MATCHING ---------------- */
const STOP = new Set(['the','a','an','is','are','how','to','of','in','on','for','and','or','what','why','when','where','which','do','does','can','i','we','you','මම','මට','මොකක්ද','කොහොමද','කොහේද','ඇයි','කරන්නේ','කරන්න','ගැන','එක','එකේ','ද','යනු','என்ன','எப்படி']);

function norm(s){return (s||'').toLowerCase().replace(/[^\w\s\u0D80-\u0DFF\u0B80-\u0BFF]/g,' ');}
function tokens(s){return norm(s).split(/\s+/).filter(w=>w.length>1&&!STOP.has(w));}

function detectLang(text){
  if(/[\u0D80-\u0DFF]/.test(text)) return 'si';
  if(/[\u0B80-\u0BFF]/.test(text)) return 'ta';
  return 'en';
}

function scoreEntry(entry, toks){
  let score = 0;
  for(const kw of entry.k){
    const k=kw.toLowerCase();
    if(toks.some(t=>t===k)) score += 5;
    else if(toks.some(t=>t.includes(k)||k.includes(t))) score += 2;
  }
  return score;
}

function findBest(text, lang){
  const toks = tokens(text);
  let best=null, bestScore=0;
  for(const id in KB){
    const s = scoreEntry(KB[id], toks);
    if(s>bestScore){bestScore=s;best={id,entry:KB[id],score:s};}
  }
  return bestScore>=2?best:null;
}

function detectIntent(text){
  const t=norm(text);
  if(/(how|කොහොමද|කරන්නේ|எப்படி|steps|procedure|process)/.test(t)) return 'howto';
  if(/(error|issue|problem|fail|wrong|fix|ගැටලුව|දෝෂ|பிழை)/.test(t)) return 'trouble';
  if(/(difference|vs|versus|compare|වෙනස|अंतर)/.test(t)) return 'compare';
  if(/(what is|what are|define|meaning|මොකක්ද|அர்த்தம்)/.test(t)) return 'define';
  if(/(why|ඇයි|ஏன்|importance)/.test(t)) return 'why';
  return 'general';
}

/* ---------------- 3. STATE ---------------- */
const state = { history:[], lastTopic:null, lastLang:'si', busy:false, apiOk:false };

/* ---------------- 4. UI BINDING ---------------- */
const $ = s => document.querySelector(s);
let elChat, elIn, elSend, elChips, elStatus, elClear;

function rebind(node){
  if(!node) return null;
  const clone = node.cloneNode(true);
  node.parentNode.replaceChild(clone,node);
  return clone;
}

function initUI(){
  const t5 = document.getElementById('t5');
  if(!t5) return;

  elChat   = rebind(document.getElementById('chat'));
  elIn     = rebind(document.getElementById('aiIn'));
  elSend   = rebind(document.getElementById('aiSend'));
  elChips  = rebind(document.getElementById('aiChips'));
  elStatus = document.getElementById('aiStatus');
  elClear  = document.getElementById('aiClear');

  // auto-grow textarea
  elIn.addEventListener('input',()=>{
    elIn.style.height='auto';
    elIn.style.height=Math.min(elIn.scrollHeight,120)+'px';
  });

  // send
  elSend.addEventListener('click',onSend);
  elIn.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); onSend(); }
  });

  // clear
  if(elClear) elClear.addEventListener('click',()=>{
    state.history=[]; state.lastTopic=null;
    elChat.innerHTML='';
    greeting();
    setStatus('Ready · SAP, Oracle, Andon ගැන ඕනෑම ප්‍රශ්නයක් අහන්න');
  });

  // welcome
  greeting();
}

function greeting(){
  addMessage('ai',
    '👋 ආයුබෝවන්! මම ඔබේ <b>AI Training Coach</b>. SAP, Oracle HCM, Andon, 3D, SharePoint, HRIS, AI, Dashboard — ඕනෑම ගැන අහන්න. Context memory තියෙන නිසා follow-up ප්‍රශ්නත් අහන්න පුළුවන්.',
    null, ['sap-grn','sap-miro','andon-howto','ai-security','dash-huddle']);
}

function setStatus(txt,cls){
  if(!elStatus) return;
  elStatus.className = 'ai-status'+(cls?' '+cls:'');
  elStatus.innerHTML = '<i></i> <span>'+txt+'</span>';
}

function addMessage(who,html,src,related){
  const wrap = document.createElement('div');
  wrap.className = 'msg '+who;
  wrap.innerHTML = html + (src?`<span class="ai-src">📖 Source: ${src}</span>`:'');
  if(related && related.length){
    const rel=document.createElement('div');
    rel.className='ai-related';
    related.forEach(id=>{
      const e=KB[id]; if(!e) return;
      const label = (e.si||e.en||'').slice(0,42).replace(/<[^>]+>/g,'') + '…';
      const btn=document.createElement('button');
      btn.textContent = '↳ '+label;
      btn.addEventListener('click',()=>{ elIn.value=label; onSend(); });
      rel.appendChild(btn);
    });
    wrap.appendChild(rel);
  }
  elChat.appendChild(wrap);
  elChat.scrollTop = elChat.scrollHeight;
  return wrap;
}

function typingBubble(){
  const wrap = document.createElement('div');
  wrap.className='msg ai';
  wrap.innerHTML='<span class="ai-typing-dots"><span></span><span></span><span></span></span>';
  elChat.appendChild(wrap);
  elChat.scrollTop = elChat.scrollHeight;
  return wrap;
}

/* ---------------- 5. MAIN SEND FLOW ---------------- */
async function onSend(){
  const text = elIn.value.trim();
  if(!text || state.busy) return;
  state.busy = true;
  elIn.value=''; elIn.style.height='auto';

  const lang = detectLang(text);
  state.lastLang = lang;

  addMessage('me', escapeHtml(text));
  state.history.push({role:'user',content:text});

  const tb = typingBubble();
  setStatus('Thinking · context analyze කරමින්...', 'thinking');

  try {
    let reply;
    if(AI_API.enabled && AI_API.endpoint){
      reply = await callAPI(text);
    } else {
      // simulate natural thinking delay
      await sleep(500 + Math.random()*500);
      reply = composeReply(text, lang);
    }
    tb.remove();
    addMessage('ai', reply.html, reply.src, reply.related);
    state.history.push({role:'assistant',content:reply.plain||reply.html});
    setStatus('Ready · context memory active');
  } catch(err){
    tb.remove();
    addMessage('ai','⚠️ Sorry, මට ඒක process කරන්න බැරි වුනා. නැවත උත්සාහ කරන්න හෝ වෙනත් වචන වලින් අහන්න.<br><small class="mu">'+escapeHtml(err.message||'')+'</small>',null,['sap-grn','__greeting']);
    setStatus('Error · retry','error');
  } finally {
    state.busy = false;
    elIn.focus();
  }
}

function composeReply(text, lang){
  // greeting / thanks shortcuts
  if(/^(hi|hello|hey|ayubowan|හායි|vanakkam)\b/i.test(text)){
    return buildReply('__greeting', lang, 'general');
  }
  if(/\b(thanks|thank you|ස්තූතියි|nandri)\b/i.test(text)){
    return buildReply('__thanks', lang, 'general');
  }

  const intent = detectIntent(text);
  const best = findBest(text, lang);

  // follow-up: "and then", "what about X", "why" with no strong match → use lastTopic
  if(!best && state.lastTopic && /^(and|then|එතකොට|ඊට|what about|why|ඇයි)/i.test(text)){
    const id = state.lastTopic;
    const entry = KB[id];
    return buildReply(id, lang, 'howto', entry);
  }

  if(best){
    state.lastTopic = best.id;
    return buildReply(best.id, lang, intent, best.entry);
  }

  // smart fallback with suggestions
  return {
    html: lang==='en'
      ? '🤔 මට ඒක හරියටම හඳුනාගන්න බැරි වුනා. පහත topics ගැන අහන්න පුළුවන් — නැත්නම් ප්‍රශ්නය තව වචන කිහිපයකින් ලියන්න (T-code, system name).'
      : lang==='ta'
      ? '🤔 எனக்கு அது புரியவில்லை. கீழே உள்ள தலைப்புகளில் ஏதாவது கேளுங்கள்.'
      : '🤔 මට ඒක හරියටම හඳුනාගන්න බැරි වුනා. T-code එකක් හෝ system name එකක් එකතු කරලා නැවත අහන්න. උදා: <i>"MIGO 101 error"</i>, <i>"Andon escalation"</i>, <i>"SAP MRP settings"</i>.',
    src:'',
    related:['sap-grn','sap-miro','sap-error-stock','andon-howto','ai-prompt','dash-huddle']
  };
}

function buildReply(id, lang, intent, entry){
  entry = entry || KB[id];
  if(!entry) return composeReply('', lang);

  let body = entry[lang] || entry.si || entry.en || '';
  // steps
  if(entry.steps && entry.steps.length && (intent==='howto' || intent==='general')){
    body += '<ul class="ai-steps">' + entry.steps.map(s=>'<li>'+s+'</li>').join('') + '</ul>';
  }
  // intent-specific prompt
  if(intent==='compare'){
    body = '📊 '+body+'<br><small class="mu">💡 Compare කරන්න ඕන දේවල් දෙකක් ඔබ specify කරන්න — එතකොට තව පැහැදිලි කරන්නම්.</small>';
  } else if(intent==='why'){
    body = '❓ '+body;
  }
  return {
    html: body,
    plain: body.replace(/<[^>]+>/g,''),
    src: entry.src || '',
    related: entry.rel || []
  };
}

/* ---------------- 6. OPTIONAL API HOOK ---------------- */
async function callAPI(userText){
  const messages = state.history.concat([{role:'user',content:userText}]).slice(-10);
  const res = await fetch(AI_API.endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages})
  });
  if(!res.ok) throw new Error('API '+res.status);
  const data = await res.json();
  const html = (data.reply||data.content||'No response').replace(/\n/g,'<br>');
  return { html, plain:data.reply||data.content, src:data.source||'API', related:data.related||[] };
}

/* ---------------- 7. HELPERS ---------------- */
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------------- 8. BOOT ---------------- */
function boot(){
  if(document.getElementById('t5')) initUI();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

// expose KB & API for admin extension
window.AI_COACH = { KB, state, AI_API };
})();
</script>
